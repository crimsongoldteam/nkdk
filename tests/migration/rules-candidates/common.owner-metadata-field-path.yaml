format: nkdk-declarations/1
kind: value
id: common.owner-metadata-field-path
imports:
  standard: common.owner-standard-field-path
  ordinary: common.owner-ordinary-field-path
  root: common.path-root
inputs:
  ownerRoot:
    type:
      use: root
  ownerName:
    type:
      kind: scalar
      scalar: text
value:
  kind: choice
  variants:
    - name: standard
      type:
        use: standard
        bind:
          ownerRoot:
            input: ownerRoot
          ownerName:
            input: ownerName
    - name: ordinary
      type:
        use: ordinary
        bind:
          ownerRoot:
            input: ownerRoot
          ownerName:
            input: ownerName
representations:
  xml:
    kind: choice
  yaml:
    kind: choice
