format: nkdk-declarations/1
kind: value
id: common.metadata-command-group
imports:
  standard: common.standard-command-group
  custom: common.custom-command-group
  rootKind: common.path-root
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
  xsi: http://www.w3.org/2001/XMLSchema-instance
inputs:
  roots:
    type:
      kind: index
      key:
        kind: record
        fields:
          - name: kind
            type:
              use: rootKind
          - name: name
            type:
              kind: scalar
              scalar: text
      value:
        kind: scalar
        scalar: text
value:
  kind: choice
  variants:
    - name: standard
      type:
        use: standard
    - name: custom
      type:
        use: custom
        bind:
          roots:
            input: roots
representations:
  xml:
    kind: choice
  yaml:
    kind: choice
presence:
  - target: self
    xml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-element
          denotes:
            absent: true
    yaml:
      missing:
        denotes:
          absent: true
