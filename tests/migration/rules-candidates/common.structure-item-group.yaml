format: nkdk-declarations/1
kind: value
id: common.structure-item-group
namespaces:
  xsi: http://www.w3.org/2001/XMLSchema-instance
  dcsset: http://v8.1c.ru/8.1/data-composition-system/settings
imports:
  item: common.group-item-row
value:
  kind: sequence
  item:
    use: item
representations:
  xml:
    kind: with-attributes
    attributes:
      - name: xsi:type
        value:
          qname: dcsset:StructureItemGroup
    content:
      kind: element-sequence
      path:
        - dcsset:groupItems
        - dcsset:item
      next:
        - dcsset:item
      item:
        kind: declared
  yaml:
    kind: sequence
    item:
      kind: declared
presence:
  - target: self
    xml:
      missing:
        denotes:
          absent: true
    yaml:
      missing:
        denotes:
          absent: true
