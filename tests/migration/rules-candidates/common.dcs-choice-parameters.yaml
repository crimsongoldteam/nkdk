format: nkdk-declarations/1
kind: value
id: common.dcs-choice-parameters
namespaces:
  xsi: http://www.w3.org/2001/XMLSchema-instance
  dcscor: http://v8.1c.ru/8.1/data-composition-system/core
imports:
  item: common.choice-parameter-dcs
inputs:
  defaultLanguage:
    type:
      kind: scalar
      scalar: text
  registeredLanguages:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
value:
  kind: sequence
  item:
    use: item
    bind:
      defaultLanguage:
        input: defaultLanguage
      registeredLanguages:
        input: registeredLanguages
representations:
  xml:
    kind: with-attributes
    attributes:
      - name: xsi:type
        value:
          qname: dcscor:ChoiceParameters
    content:
      kind: element-sequence
      path:
        - dcscor:item
      item:
        kind: declared
  yaml:
    kind: record-mapping
    key: name
    value: value
    maxItems: 1
