format: nkdk-declarations/1
kind: value
id: common.user-visible-roles
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
imports:
  role: common.user-visible-role
inputs:
  roles:
    type:
      kind: sequence
      item:
        kind: record
        fields:
          - name: name
            type:
              kind: scalar
              scalar: text
          - name: yamlName
            type:
              kind: scalar
              scalar: text
value:
  kind: sequence
  item:
    use: role
representations:
  xml:
    kind: element-sequence
    path:
      - xr:Value
  yaml:
    kind: record-mapping
    key: name
    value: value
    keyTable:
      input: roles
      internal: name
      external: yamlName
