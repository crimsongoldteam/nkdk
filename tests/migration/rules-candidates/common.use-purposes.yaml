format: nkdk-declarations/1
kind: value
id: common.use-purposes
namespaces:
  v8: http://v8.1c.ru/8.1/data/core
  xsi: http://www.w3.org/2001/XMLSchema-instance
  app: http://v8.1c.ru/8.2/managed-application/core
value:
  kind: sequence
  item:
    kind: scalar
    scalar: text
representations:
  xml:
    kind: element-sequence
    path:
      - v8:Value
    item:
      kind: with-attributes
      attributes:
        - name: xsi:type
          value:
            qname: app:ApplicationUsePurpose
      content:
        kind: text
  yaml:
    kind: sequence
    item:
      kind: scalar
      scalar: text
    shorthand:
      - id: mobile
        representation:
          kind: literal
          value: МобильноеПриложение
        denotes:
          sequence:
            - literal: MobilePlatformApplication
      - id: platform-and-mobile
        representation:
          kind: literal
          value: ПлатформаИМобильноеПриложение
        denotes:
          sequence:
            - literal: PlatformApplication
            - literal: MobilePlatformApplication
presence:
  - target: self
    xml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-element
          denotes:
            absent: true
    yaml:
      missing:
        denotes:
          absent: true
constraints:
  - id: known-purpose
    appliesTo:
      - xml-import
      - yaml-validation
    assert:
      each:
        in:
          self: true
        as: purpose
        where:
          or:
            - eq:
                - var: purpose
                - literal: PlatformApplication
            - eq:
                - var: purpose
                - literal: MobilePlatformApplication
    diagnostic:
      severity: error
      at:
        self: true
      message: Неизвестное назначение использования
