format: nkdk-declarations/1
kind: value
id: common.calculated-field-order-expression
namespaces:
  dcscor: http://v8.1c.ru/8.1/data-composition-system/common
imports:
  expression: common.string
  direction: system.DataCompositionSortDirection
  flag: common.boolean
value:
  kind: record
  fields:
    - name: expression
      type:
        use: expression
    - name: direction
      type:
        use: direction
    - name: autoOrder
      type:
        use: flag
representations:
  xml:
    kind: record
    fields:
      - field: expression
        path:
          - dcscor:expression
      - field: direction
        path:
          - dcscor:orderType
      - field: autoOrder
        path:
          - dcscor:autoOrder
  yaml:
    kind: mapping
    fields:
      - field: expression
        key: Выражение
      - field: direction
        key: ТипУпорядочивания
      - field: autoOrder
        key: Автоупорядочивание
presence:
  - target:
      field: direction
    xml:
      missing:
        denotes:
          absent: true
    yaml:
      missing:
        denotes:
          absent: true
  - target:
      field: autoOrder
    xml:
      missing:
        denotes:
          absent: true
    yaml:
      missing:
        denotes:
          absent: true
