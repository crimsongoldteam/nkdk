format: nkdk-declarations/1
kind: value
id: common.dcs-primitive-text-kind
namespaces:
  xs: http://www.w3.org/2001/XMLSchema
  xr: http://v8.1c.ru/8.3/xcf/readable
  v8: http://v8.1c.ru/8.1/data/core
value:
  kind: scalar
  scalar: text
representations:
  xml:
    kind: qname-lexicon
    values:
      - name: xs:string
        literal: string
      - name: xr:MDObjectRef
        literal: reference
      - name: v8:Type
        literal: type
      - name: v8:UUID
        literal: uuid
  yaml:
    kind: scalar
    scalar: text
