format: nkdk-declarations/1
kind: value
id: common.metadata-object-path
imports:
  root: common.path-root
  name: common.metadata-name
  member: common.path-object-kind
value:
  kind: record
  fields:
    - name: root
      type:
        use: root
    - name: owner
      type:
        use: name
    - name: kind
      type:
        use: member
    - name: name
      type:
        use: name
representations:
  xml:
    kind: text-pattern
    parts:
      - field: root
      - literal: .
      - field: owner
      - literal: .
      - field: kind
      - literal: .
      - field: name
  yaml:
    kind: text-pattern
    parts:
      - field: root
      - literal: .
      - field: owner
      - literal: .
      - field: kind
      - literal: .
      - field: name
