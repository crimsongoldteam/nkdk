format: nkdk-declarations/1
kind: value
id: common.child-subsystem-names
value:
  kind: sequence
  item:
    kind: scalar
    scalar: text
representations:
  xml:
    kind: element-sequence
    path:
      - Subsystem
    item:
      kind: text
  yaml:
    kind: sequence
    item:
      kind: scalar
      scalar: text
presence:
  - target: self
    xml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-element
          denotes:
            absent: true
    yaml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-sequence
          denotes:
            absent: true
      omitWhen:
        not:
          present:
            self: true
