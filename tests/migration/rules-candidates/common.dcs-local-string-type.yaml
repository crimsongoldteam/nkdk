format: nkdk-declarations/1
kind: value
id: common.dcs-local-string-type
namespaces:
  xsi: http://www.w3.org/2001/XMLSchema-instance
  xs: http://www.w3.org/2001/XMLSchema
  v8: http://v8.1c.ru/8.1/data/core
imports:
  localized: common.i8n-text
  xmlString: common.dcs-xml-string
inputs:
  defaultLanguage:
    type:
      kind: scalar
      scalar: text
  registeredLanguages:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
value:
  kind: choice
  variants:
    - name: localized
      type:
        use: localized
        with:
          typedXML: true
          preserveEmptyXML: true
        bind:
          defaultLanguage:
            input: defaultLanguage
          registeredLanguages:
            input: registeredLanguages
          ownerName:
            literal: ''
    - name: xmlString
      type:
        use: xmlString
representations:
  xml:
    kind: choice
    attribute: xsi:type
    variants:
      - variant: localized
        in:
          - v8:LocalStringType
        emit: v8:LocalStringType
      - variant: xmlString
        in:
          - xs:string
        emit: xs:string
    otherwise: xmlString
  yaml:
    kind: choice
    variants:
      - variant: xmlString
        form: scalar
        tag: xml/string
      - variant: localized
        form: mapping
