format: nkdk-declarations/1
kind: value
id: common.dcs-order-item-field
namespaces:
  dcsset: http://v8.1c.ru/8.1/data-composition-system/settings
imports:
  flag: common.boolean
  text: common.string
  direction: system.DataCompositionSortDirection
  view: system.DataCompositionSettingsItemViewMode
value:
  kind: record
  fields:
    - name: use
      type:
        use: flag
    - name: field
      type:
        use: text
    - name: orderType
      type:
        use: direction
    - name: viewMode
      type:
        use: view
representations:
  xml:
    kind: record
    fields:
      - field: use
        path:
          - dcsset:use
      - field: field
        path:
          - dcsset:field
      - field: orderType
        path:
          - dcsset:orderType
      - field: viewMode
        path:
          - dcsset:viewMode
  yaml:
    kind: mapping
    fields:
      - field: use
        key: Использование
      - field: field
        key: Поле
      - field: orderType
        key: ТипУпорядочивания
      - field: viewMode
        key: РежимОтображения
presence:
  - target:
      field: use
    xml:
      missing:
        denotes:
          literal: true
      canonical:
        - when:
            field: use
          form: missing
        - form: ordinary
    yaml:
      missing:
        denotes:
          literal: true
      omitWhen:
        field: use
  - target:
      field: orderType
    xml:
      missing:
        denotes:
          literal: Asc
    yaml:
      missing:
        denotes:
          literal: Asc
      omitWhen:
        eq:
          - field: orderType
          - literal: Asc
  - target:
      field: viewMode
    xml:
      missing:
        denotes:
          literal: Auto
      canonical:
        - when:
            eq:
              - field: viewMode
              - literal: Auto
          form: missing
        - form: ordinary
    yaml:
      missing:
        denotes:
          literal: Auto
      omitWhen:
        eq:
          - field: viewMode
          - literal: Auto
