format: nkdk-declarations/1
kind: value
id: common.characteristics-descriptions
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
imports:
  item: common.characteristics-description
value:
  kind: sequence
  item:
    use: item
representations:
  xml:
    kind: element-sequence
    path:
      - xr:Characteristic
    item:
      kind: declared
  yaml:
    kind: sequence
    item:
      kind: declared
presence:
  - target: self
    xml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-element
          denotes:
            absent: true
    yaml:
      missing:
        denotes:
          absent: true
