format: nkdk-declarations/1
kind: value
id: common.group-item
namespaces:
  xsi: http://www.w3.org/2001/XMLSchema-instance
  dcsset: http://v8.1c.ru/8.1/data-composition-system/settings
imports:
  field: common.group-item-field
  auto: common.group-item-auto
value:
  kind: choice
  variants:
    - name: field
      type:
        use: field
    - name: auto
      type:
        use: auto
representations:
  xml:
    kind: choice
    attribute: xsi:type
    variants:
      - variant: field
        in:
          - dcsset:GroupItemField
        emit: dcsset:GroupItemField
      - variant: auto
        in:
          - dcsset:GroupItemAuto
        emit: dcsset:GroupItemAuto
    otherwise: field
  yaml:
    kind: choice
    variants:
      - variant: field
        form: mapping
        key: Поле
