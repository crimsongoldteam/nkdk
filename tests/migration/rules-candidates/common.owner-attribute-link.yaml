format: nkdk-declarations/1
kind: value
id: common.owner-attribute-link
imports:
  root: common.path-root
  name: common.metadata-name
inputs:
  ownerRoot:
    type:
      use: root
  ownerName:
    type:
      kind: scalar
      scalar: text
  attributes:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
value:
  kind: record
  fields:
    - name: root
      type:
        use: root
    - name: owner
      type:
        use: name
    - name: name
      type:
        use: name
representations:
  xml:
    kind: text-pattern
    separator: .
    parts:
      - field: root
      - field: owner
      - literal: Attribute
      - field: name
  yaml:
    kind: text-pattern
    parts:
      - field: name
presence:
  - target:
      field: root
    yaml:
      default:
        input: ownerRoot
  - target:
      field: owner
    yaml:
      default:
        input: ownerName
  - target: self
    xml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-element
          denotes:
            absent: true
    yaml:
      missing:
        denotes:
          absent: true
constraints:
  - id: direct-boolean-attribute
    appliesTo:
      - xml-import
      - yaml-validation
    assert:
      and:
        - eq:
            - get:
                of:
                  self: true
                field: root
            - input: ownerRoot
        - eq:
            - get:
                of:
                  self: true
                field: owner
            - input: ownerName
        - exists:
            in:
              input: attributes
            as: candidate
            where:
              eq:
                - var: candidate
                - get:
                    of:
                      self: true
                    field: name
    diagnostic:
      code: metadata.target-missing
      severity: error
      at:
        self: true
      message: Direct boolean attribute is missing
