format: nkdk-declarations/1
kind: value
id: common.dcs-design-time-choice
namespaces:
  xsi: http://www.w3.org/2001/XMLSchema-instance
  xs: http://www.w3.org/2001/XMLSchema
  v8: http://v8.1c.ru/8.1/data/core
  dcscor: http://v8.1c.ru/8.1/data-composition-system/core
imports:
  path: common.dcs-design-time-value
  field: common.dcs-design-time-explicit-field
  localized: common.dcs-design-time-localized-text
  formatted: common.dcs-design-time-formatted-text
  text: common.dcs-xml-string
inputs:
  defaultLanguage:
    type:
      kind: scalar
      scalar: text
  registeredLanguages:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
value:
  kind: choice
  variants:
    - name: path
      type:
        use: path
    - name: field
      type:
        use: field
    - name: localized
      type:
        use: localized
        bind:
          defaultLanguage:
            input: defaultLanguage
          registeredLanguages:
            input: registeredLanguages
    - name: formatted
      type:
        use: formatted
        bind:
          defaultLanguage:
            input: defaultLanguage
          registeredLanguages:
            input: registeredLanguages
    - name: text
      type:
        use: text
representations:
  xml:
    kind: choice
    attribute: xsi:type
    variants:
      - variant: path
        in:
          - dcscor:DesignTimeValue
        emit: dcscor:DesignTimeValue
      - variant: field
        in:
          - dcscor:Field
        emit: dcscor:Field
      - variant: localized
        in:
          - v8:LocalStringType
        emit: v8:LocalStringType
      - variant: formatted
        in:
          - v8:LocalFormattedStringType
        emit: v8:LocalFormattedStringType
      - variant: text
        in:
          - xs:string
        emit: xs:string
    otherwise: text
  yaml:
    kind: choice
    variants:
      - variant: field
        form: mapping
        key: Тип
      - variant: localized
        form: mapping
        key: Тип
      - variant: formatted
        form: mapping
        key: Тип
