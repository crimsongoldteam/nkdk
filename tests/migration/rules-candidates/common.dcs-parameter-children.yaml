format: nkdk-declarations/1
kind: value
id: common.dcs-parameter-children
namespaces:
  dcscor: http://v8.1c.ru/8.1/data-composition-system/core
imports:
  item: common.dcs-parameter-value
parameters:
  settingsXsi:
    type:
      kind: scalar
      scalar: boolean
    default: false
inputs:
  parameterName:
    type:
      kind: scalar
      scalar: text
  valueProfile:
    type:
      kind: scalar
      scalar: text
  styleTypes:
    type:
      kind: index
      key:
        kind: scalar
        scalar: text
      value:
        kind: scalar
        scalar: text
  defaultLanguage:
    type:
      kind: scalar
      scalar: text
  registeredLanguages:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
  labels:
    type:
      kind: index
      key:
        kind: record
        fields:
          - name: name
            type:
              kind: scalar
              scalar: text
          - name: code
            type:
              kind: scalar
              scalar: text
      value:
        kind: scalar
        scalar: text
  codes:
    type:
      kind: index
      key:
        kind: record
        fields:
          - name: name
            type:
              kind: scalar
              scalar: text
          - name: label
            type:
              kind: scalar
              scalar: text
      value:
        kind: scalar
        scalar: text
value:
  kind: sequence
  item:
    use: item
    with:
      settingsXsi:
        parameter: settingsXsi
    bind:
      parameterName:
        input: parameterName
      valueProfile:
        input: valueProfile
      styleTypes:
        input: styleTypes
      defaultLanguage:
        input: defaultLanguage
      registeredLanguages:
        input: registeredLanguages
      labels:
        input: labels
      codes:
        input: codes
representations:
  xml:
    kind: element-sequence
    path:
      - dcscor:item
  yaml:
    kind: sequence
presence:
  - target: self
    xml:
      missing:
        denotes:
          absent: true
    yaml:
      missing:
        denotes:
          absent: true
      omitWhen:
        eq:
          - self: true
          - sequence: []
