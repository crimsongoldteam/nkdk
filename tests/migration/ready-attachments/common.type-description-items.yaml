format: nkdk-declarations/1
kind: value
id: common.type-description-items
imports:
  item: common.type-description-item
parameters:
  requireValues:
    type:
      kind: scalar
      scalar: boolean
    default: false
  metadataAttributeTypesOnly:
    type:
      kind: scalar
      scalar: boolean
    default: false
value:
  kind: sequence
  item:
    use: item
    with:
      metadataAttributeTypesOnly:
        parameter: metadataAttributeTypesOnly
representations:
  xml:
    kind: element-sequence
    path: []
    item:
      kind: declared
  yaml:
    kind: sequence
    singleton: scalar
    item:
      kind: declared
presence:
  - target: self
    xml:
      missing:
        denotes:
          absent: true
    yaml:
      missing:
        denotes:
          absent: true
constraints:
  - id: has-values
    appliesTo:
      - xml-import
      - yaml-validation
    when:
      parameter: requireValues
    assert:
      exists:
        in:
          self: true
        as: item
        where:
          literal: true
    diagnostic:
      code: type-description.empty
      severity: error
      at:
        self: true
      message: Описание должно содержать хотя бы один тип
