format: nkdk-declarations/1
kind: value
id: common.metadata-object-link-list
imports:
  item: common.metadata-object-link
  root: common.path-root
inputs:
  roots:
    type:
      kind: index
      key:
        kind: record
        fields:
          - name: kind
            type:
              use: root
          - name: name
            type:
              kind: scalar
              scalar: text
      value:
        kind: scalar
        scalar: text
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
value:
  kind: sequence
  item:
    use: item
    with:
      typedXML: true
    bind:
      roots:
        input: roots
representations:
  xml:
    kind: element-sequence
    path:
      - xr:Item
  yaml:
    kind: sequence
presence:
  - target: self
    xml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-element
          denotes:
            absent: true
      canonical:
        - when:
            not:
              present:
                self: true
          form: empty-element
        - form: ordinary
    yaml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-sequence
          denotes:
            absent: true
      omitWhen:
        not:
          present:
            self: true
