format: nkdk-declarations/1
kind: value
id: common.metadata-fixed-array
imports:
  item: common.metadata-value-item
namespaces:
  v8: http://v8.1c.ru/8.1/data/core
inputs:
  defaultLanguage:
    type:
      kind: scalar
      scalar: text
  registeredLanguages:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
value:
  kind: sequence
  item:
    use: item
    bind:
      defaultLanguage:
        input: defaultLanguage
      registeredLanguages:
        input: registeredLanguages
representations:
  xml:
    kind: element-sequence
    path:
      - v8:Value
    item:
      kind: declared
  yaml:
    kind: sequence
    item:
      kind: declared
