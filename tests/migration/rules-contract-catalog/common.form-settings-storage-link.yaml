format: nkdk-declarations/1
kind: value
id: common.form-settings-storage-link
imports:
  report: common.form-settings-storage-report-form
  storage: common.form-settings-storage-object
  empty: common.metadata-link-empty
  rootKind: common.path-root
inputs:
  ownerName:
    type:
      kind: scalar
      scalar: text
  roots:
    type:
      kind: index
      key:
        kind: record
        fields:
          - name: kind
            type:
              use: rootKind
          - name: name
            type:
              kind: scalar
              scalar: text
      value:
        kind: scalar
        scalar: text
  formTargets:
    type:
      kind: index
      key:
        kind: record
        fields:
          - name: parent
            type:
              kind: scalar
              scalar: text
          - name: name
            type:
              kind: scalar
              scalar: text
      value:
        kind: scalar
        scalar: text
value:
  kind: choice
  variants:
    - name: report
      type:
        use: report
        bind:
          ownerName:
            input: ownerName
          roots:
            input: roots
          formTargets:
            input: formTargets
    - name: storage
      type:
        use: storage
        bind:
          roots:
            input: roots
    - name: empty
      type:
        use: empty
representations:
  xml:
    kind: choice
  yaml:
    kind: choice
    fallback: report
