format: nkdk-declarations/1
kind: value
id: contract.generic-standard-type-link
namespaces:
  xsi: http://www.w3.org/2001/XMLSchema-instance
  xs: http://www.w3.org/2001/XMLSchema
imports:
  path: contract.generic-standard-open
parameters:
  typedXML:
    type:
      kind: scalar
      scalar: boolean
    default: false
value:
  use: path
  bind:
    profiles:
      input: profiles
representations:
  xml:
    kind: with-attributes
    attributes:
      - name: xsi:type
        value:
          qname: xs:string
        when:
          parameter: typedXML
    content:
      kind: choice
  yaml:
    kind: choice
inputs:
  profiles:
    type:
      kind: sequence
      item:
        kind: record
        fields:
          - name: name
            type:
              kind: scalar
              scalar: text
          - name: yamlName
            type:
              kind: scalar
              scalar: text
          - name: pathName
            type:
              kind: scalar
              scalar: text
          - name: emptyForm
            type:
              kind: scalar
              scalar: text
          - name: policy
            type:
              kind: scalar
              scalar: text
          - name: expectedKind
            type:
              kind: scalar
              scalar: text
          - name: maxTextLength
            type:
              kind: scalar
              scalar: text
          - name: maxNumberDigits
            type:
              kind: scalar
              scalar: text
          - name: allowedTextLength
            type:
              kind: scalar
              scalar: text
          - name: owners
            type:
              kind: sequence
              item:
                kind: scalar
                scalar: text
