format: nkdk-declarations/1
kind: value
id: contract.standard-fill-named-item
description: >-
  Значение заполнения стандартного реквизита; смысловые ограничения задаёт
  декларация владельца
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
imports:
  choice: common.metadata-value
  name: common.standard-attribute-name
inputs:
  defaultLanguage:
    type:
      kind: scalar
      scalar: text
  registeredLanguages:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
  owners:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
  componentKind:
    type:
      kind: scalar
      scalar: text
  maxTextLength:
    type:
      kind: scalar
      scalar: text
  allowedTextLength:
    type:
      kind: scalar
      scalar: text
  maxNumberDigits:
    type:
      kind: scalar
      scalar: text
value:
  kind: record
  fields:
    - name: name
      type:
        use: name
    - name: value
      type:
        use: choice
        with:
          exportNilValue: true
        bind:
          defaultLanguage:
            input: defaultLanguage
          registeredLanguages:
            input: registeredLanguages
          onlyStringType:
            literal: false
    - name: policy
      type:
        kind: scalar
        scalar: text
    - name: expectedKind
      type:
        kind: scalar
        scalar: text
representations:
  xml:
    kind: record
    fields:
      - field: name
        path: []
        attribute: name
      - field: value
        path:
          - xr:FillValue
  yaml:
    kind: mapping
    fields:
      - field: name
        key: Имя
      - field: value
        key: ЗначениеЗаполнения
presence:
  - target:
      field: value
    xml:
      missing:
        denotes:
          absent: true
      empty:
        - form: nil
          denotes:
            absent: true
      canonical:
        - when:
            not:
              present:
                field: value
          form: nil
    yaml:
      missing:
        denotes:
          if:
            and:
              - eq:
                  - field: policy
                  - literal: ownerReference
              - eq:
                  - input: componentKind
                  - literal: configuration
              - one:
                  in:
                    input: owners
                  as: owner
                  where:
                    literal: true
          then:
            parseYaml:
              match:
                value:
                  find:
                    in:
                      input: owners
                    as: owner
                    where:
                      literal: true
                present:
                  as: owner
                  then:
                    concat:
                      - var: owner
                      - literal: .ПустаяСсылка
                absent:
                  literal: ''
          else:
            absent: true
  - target:
      field: policy
    xml:
      missing:
        denotes:
          if:
            eq:
              - field: name
              - literal: Owner
          then:
            literal: ownerReference
          else:
            literal: notSpecified
    yaml:
      missing:
        denotes:
          if:
            eq:
              - field: name
              - literal: Owner
          then:
            literal: ownerReference
          else:
            literal: notSpecified
  - target:
      field: expectedKind
    xml:
      missing:
        denotes:
          if:
            eq:
              - field: name
              - literal: Owner
          then:
            literal: reference
          else:
            literal: ''
    yaml:
      missing:
        denotes:
          if:
            eq:
              - field: name
              - literal: Owner
          then:
            literal: reference
          else:
            literal: ''
constraints:
  - id: forbidden-value
    appliesTo:
      - xml-import
      - yaml-validation
    when:
      eq:
        - field: policy
        - literal: forbidden
    assert:
      not:
        present:
          field: value
    diagnostic:
      code: fill-value.forbidden
      severity: warning
      at:
        field: value
      message: Значение заполнения запрещено для этого стандартного реквизита
  - id: expected-value-kind
    appliesTo:
      - xml-import
      - yaml-validation
    when:
      and:
        - present:
            field: value
        - not:
            eq:
              - field: expectedKind
              - literal: ''
    assert:
      or:
        - and:
            - eq:
                - field: expectedKind
                - literal: text
            - isVariant:
                value:
                  field: value
                variant: text
        - and:
            - eq:
                - field: expectedKind
                - literal: decimal
            - isVariant:
                value:
                  field: value
                variant: decimal
        - and:
            - eq:
                - field: expectedKind
                - literal: boolean
            - isVariant:
                value:
                  field: value
                variant: boolean
        - and:
            - eq:
                - field: expectedKind
                - literal: calendar
            - isVariant:
                value:
                  field: value
                variant: calendar
        - and:
            - eq:
                - field: expectedKind
                - literal: reference
            - isVariant:
                value:
                  field: value
                variant: reference
    diagnostic:
      code: fill-value.type-mismatch
      severity: warning
      at:
        field: value
      message: Значение заполнения не соответствует типу стандартного реквизита
  - id: owner-reference
    appliesTo:
      - xml-import
      - yaml-validation
    when:
      and:
        - eq:
            - field: policy
            - literal: ownerReference
        - isVariant:
            value:
              field: value
            variant: reference
    assert:
      or:
        - and:
            - exists:
                in:
                  input: owners
                as: owner
                where:
                  literal: true
            - not:
                one:
                  in:
                    input: owners
                  as: owner
                  where:
                    literal: true
            - eq:
                - variantText:
                    value:
                      field: value
                    variant: reference
                - literal: .
        - exists:
            in:
              input: owners
            as: owner
            where:
              textSegmentPrefix:
                value:
                  variantText:
                    value:
                      field: value
                    variant: reference
                prefix:
                  var: owner
                separator: .
    diagnostic:
      code: fill-value.type-mismatch
      severity: warning
      at:
        field: value
      message: Ссылка значения заполнения не принадлежит владельцу
  - id: text-length
    appliesTo:
      - xml-import
      - yaml-validation
    when:
      and:
        - eq:
            - field: expectedKind
            - literal: text
        - isVariant:
            value:
              field: value
            variant: text
        - matches:
            value:
              input: maxTextLength
            pattern: '[1-9][0-9]*'
        - not:
            eq:
              - input: allowedTextLength
              - literal: Fixed
    assert:
      textLengthAtMost:
        value:
          variantValue:
            value:
              field: value
            variant: text
        limit:
          input: maxTextLength
    diagnostic:
      code: fill-value.string-length
      severity: warning
      at:
        field: value
      message: Значение заполнения превышает длину стандартного реквизита
  - id: fixed-text-length
    appliesTo:
      - xml-import
      - yaml-validation
    when:
      and:
        - eq:
            - field: expectedKind
            - literal: text
        - isVariant:
            value:
              field: value
            variant: text
        - matches:
            value:
              input: maxTextLength
            pattern: '[1-9][0-9]*'
        - eq:
            - input: allowedTextLength
            - literal: Fixed
    assert:
      textLengthEquals:
        value:
          variantValue:
            value:
              field: value
            variant: text
        limit:
          input: maxTextLength
    diagnostic:
      code: fill-value.string-length
      severity: warning
      at:
        field: value
      message: >-
        Значение заполнения не соответствует фиксированной длине стандартного
        реквизита
  - id: number-digits
    appliesTo:
      - xml-import
      - yaml-validation
    when:
      and:
        - eq:
            - field: expectedKind
            - literal: decimal
        - isVariant:
            value:
              field: value
            variant: decimal
        - matches:
            value:
              input: maxNumberDigits
            pattern: '[1-9][0-9]*'
    assert:
      decimalFits:
        value:
          variantValue:
            value:
              field: value
            variant: decimal
        digits:
          input: maxNumberDigits
        fraction:
          literal: '0'
        sign:
          literal: Nonnegative
    diagnostic:
      code: fill-value.number-qualifiers
      severity: warning
      at:
        field: value
      message: Значение заполнения не соответствует длине стандартного реквизита
