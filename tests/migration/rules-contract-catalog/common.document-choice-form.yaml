format: nkdk-declarations/1
kind: value
id: common.document-choice-form
imports:
  own: common.document-owned-choice-form
  common: common.common-form-link
  journal: common.journal-form-link
  empty: common.metadata-link-empty
  rootKind: common.path-root
inputs:
  owner:
    type:
      kind: scalar
      scalar: text
  forms:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
  roots:
    type:
      kind: index
      key:
        kind: record
        fields:
          - name: kind
            type:
              use: rootKind
          - name: name
            type:
              kind: scalar
              scalar: text
      value:
        kind: scalar
        scalar: text
  formTargets:
    type:
      kind: index
      key:
        kind: record
        fields:
          - name: parent
            type:
              kind: scalar
              scalar: text
          - name: name
            type:
              kind: scalar
              scalar: text
      value:
        kind: scalar
        scalar: text
value:
  kind: choice
  variants:
    - name: own
      type:
        use: own
        bind:
          owner:
            input: owner
          forms:
            input: forms
    - name: common
      type:
        use: common
        bind:
          roots:
            input: roots
    - name: journal
      type:
        use: journal
        bind:
          roots:
            input: roots
          forms:
            input: formTargets
    - name: empty
      type:
        use: empty
representations:
  xml:
    kind: choice
  yaml:
    kind: choice
    fallback: own
