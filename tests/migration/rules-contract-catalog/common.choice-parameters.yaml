format: nkdk-declarations/1
kind: value
id: common.choice-parameters
namespaces:
  app: http://v8.1c.ru/8.2/managed-application/core
imports:
  item: common.choice-parameter
inputs:
  defaultLanguage:
    type:
      kind: scalar
      scalar: text
  registeredLanguages:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
value:
  kind: sequence
  item:
    use: item
    bind:
      defaultLanguage:
        input: defaultLanguage
      registeredLanguages:
        input: registeredLanguages
representations:
  xml:
    kind: element-sequence
    path:
      - app:item
  yaml:
    kind: record-mapping
    key: name
    value: value
