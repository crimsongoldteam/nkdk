format: nkdk-declarations/1
kind: value
id: common.picture-reference-expanded
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
imports:
  reference: common.picture-reference
  transparent: common.boolean
  pixel: common.picture-pixel
value:
  kind: record
  fields:
    - name: reference
      type:
        use: reference
    - name: transparent
      type:
        use: transparent
    - name: pixel
      type:
        use: pixel
representations:
  xml:
    kind: record
    fields:
      - field: reference
        path:
          - xr:Ref
      - field: transparent
        path:
          - xr:LoadTransparent
      - field: pixel
        path:
          - xr:TransparentPixel
  yaml:
    kind: mapping
    fields:
      - field: reference
        key: Ссылка
      - field: transparent
        key: ПрозрачныйФон
      - field: pixel
        key: ПрозрачныйПиксель
presence:
  - target:
      field: pixel
    xml:
      missing:
        denotes:
          absent: true
    yaml:
      missing:
        denotes:
          absent: true
