format: nkdk-declarations/1
kind: value
id: common.dcs-typed-reference
imports:
  root: common.dcs-typed-reference-root
  name: common.metadata-name
  member: common.dcs-typed-reference-member
value:
  kind: record
  fields:
    - name: root
      type:
        use: root
    - name: owner
      type:
        use: name
    - name: member
      type:
        use: member
representations:
  xml:
    kind: text-pattern
    separator: .
    parts:
      - field: root
      - field: owner
      - field: member
  yaml:
    kind: text-pattern
    separator: .
    parts:
      - field: root
      - field: owner
      - field: member
