format: nkdk-declarations/1
kind: value
id: contract.standard-canonical-names-list
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
imports:
  item: contract.standard-name-item
value:
  kind: sequence
  item:
    use: item
representations:
  xml:
    kind: element-sequence
    path:
      - xr:StandardAttribute
  yaml:
    kind: record-mapping
    key: name
    omitEmptyFor: canonicalNames
    emptyTag: xml/standard-attributes
inputs:
  canonicalNames:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
presence:
  - target: self
    xml:
      missing:
        denotes:
          absent: true
    yaml:
      missing:
        denotes:
          map:
            in:
              input: canonicalNames
            as: name
            value:
              record:
                name:
                  var: name
