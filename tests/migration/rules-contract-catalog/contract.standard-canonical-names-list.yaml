format: nkdk-declarations/1
kind: value
id: contract.standard-canonical-names-list
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
imports:
  item: contract.standard-name-item
value:
  kind: sequence
  item:
    use: item
representations:
  xml:
    kind: element-sequence
    path:
      - xr:StandardAttribute
  yaml:
    kind: record-mapping
    key: name
    restoreFrom: canonicalNames
    omitEmptyFor: elidableNames
    emptyTag: xml/standard-attributes
inputs:
  canonicalNames:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
  elidableNames:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
presence:
  - target: self
    xml:
      missing:
        denotes:
          absent: true
