format: nkdk-declarations/1
kind: value
id: contract.generic-standard-segment
imports:
  ordinary: common.metadata-ordinary-field-segment
  standard: contract.generic-standard-standard-segment
  object: common.metadata-object-field-segment
value:
  kind: choice
  variants:
    - name: ordinary
      type:
        use: ordinary
    - name: standard
      type:
        use: standard
        bind:
          profiles:
            input: profiles
    - name: object
      type:
        use: object
representations:
  xml:
    kind: choice
  yaml:
    kind: choice
inputs:
  profiles:
    type:
      kind: sequence
      item:
        kind: record
        fields:
          - name: name
            type:
              kind: scalar
              scalar: text
          - name: yamlName
            type:
              kind: scalar
              scalar: text
          - name: pathName
            type:
              kind: scalar
              scalar: text
          - name: emptyForm
            type:
              kind: scalar
              scalar: text
          - name: policy
            type:
              kind: scalar
              scalar: text
          - name: expectedKind
            type:
              kind: scalar
              scalar: text
          - name: maxTextLength
            type:
              kind: scalar
              scalar: text
          - name: maxNumberDigits
            type:
              kind: scalar
              scalar: text
          - name: allowedTextLength
            type:
              kind: scalar
              scalar: text
          - name: owners
            type:
              kind: sequence
              item:
                kind: scalar
                scalar: text
