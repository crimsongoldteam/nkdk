    type:
      kind: index
      key:
        kind: record
        fields:
          - name: kind
            type:
              use: root
          - name: name
            type:
              kind: scalar
              scalar: text
      value:
        kind: scalar
        scalar: text
  forms:
    type:
      kind: index
      key:
        kind: record
        fields:
          - name: parent
            type:
              kind: scalar
              scalar: text
          - name: name
            type:
              kind: scalar
              scalar: text
      value:
        kind: scalar
        scalar: text
  typeItems:
    type:
      kind: sequence
      item:
        use: item
        with:
          metadataAttributeTypesOnly: true
value:
  kind: record
  fields:
    - name: root
      type:
        use: root
    - name: owner
      type:
        use: name
    - name: form
      type:
        use: name
representations:
  xml:
    kind: text-pattern
    separator: .
    parts:
      - field: root
      - field: owner
      - literal: Form
      - field: form
  yaml:
    kind: text-pattern
    parts:
      - optional: owner
        parts:
          - field: root
          - literal: .
          - field: owner
          - literal: .Форма.
      - field: form
presence:
