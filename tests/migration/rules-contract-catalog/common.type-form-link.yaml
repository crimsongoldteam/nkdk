description: Ссылка на форму с сокращением по единственному объектному Тип
types:
  owner-after-dot:
    kind: text-transform
    units: utf16
    classes:
      separator:
        - - 46
          - 46
    state:
      seen: false
    transitions:
      - when:
          class: separator
        emit: discard
        set:
          seen: true
      - when:
          flag: seen
        emit: append
        set: {}
      - emit: discard
        set: {}
    result:
      separator: ''
      first:
        kind: identity
      rest:
        kind: identity
      lowercase: []
      emptyInput: absent
      noTokens: absent
