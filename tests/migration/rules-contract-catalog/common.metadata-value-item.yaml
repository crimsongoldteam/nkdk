format: nkdk-declarations/1
kind: value
id: common.metadata-value-item
namespaces:
  xsi: http://www.w3.org/2001/XMLSchema-instance
imports:
  value: common.metadata-value
inputs:
  defaultLanguage:
    type:
      kind: scalar
      scalar: text
  registeredLanguages:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
value:
  kind: record
  fields:
    - name: value
      type:
        use: value
        with:
          fixedArrayItem: true
        bind:
          defaultLanguage:
            input: defaultLanguage
          registeredLanguages:
            input: registeredLanguages
          onlyStringType:
            literal: false
representations:
  xml:
    kind: record
    fields:
      - field: value
        path: []
  yaml:
    kind: projection
    field: value
presence:
  - target:
      field: value
    xml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-element
          denotes:
            absent: true
        - form: nil
          denotes:
            absent: true
      canonical:
        - when:
            not:
              present:
                field: value
          form: nil
    yaml:
      missing:
        denotes:
          absent: true
      empty:
        - form: null
          denotes:
            absent: true
