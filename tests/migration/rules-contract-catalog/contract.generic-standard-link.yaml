format: nkdk-declarations/1
kind: value
id: contract.generic-standard-link
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
imports:
  path: contract.generic-standard-type-link
value:
  kind: record
  fields:
    - name: path
      type:
        use: path
        with:
          typedXML: false
        bind:
          profiles:
            input: profiles
    - name: index
      type:
        kind: scalar
        scalar: number
        profile: decimal
representations:
  xml:
    kind: record
    fields:
      - field: path
        path:
          - xr:DataPath
      - field: index
        path:
          - xr:LinkItem
  yaml:
    kind: text-pattern
    parts:
      - field: path
      - optional: index
        parts:
          - literal: (
          - field: index
          - literal: )
presence:
  - target:
      field: index
    xml:
      missing:
        denotes:
          literal: 0
    yaml:
      missing:
        denotes:
          literal: 0
      omitWhen:
        eq:
          - field: index
          - literal: 0
  - target: self
    xml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-element
          denotes:
            absent: true
    yaml:
      missing:
        denotes:
          absent: true
inputs:
  profiles:
    type:
      kind: sequence
      item:
        kind: record
        fields:
          - name: name
            type:
              kind: scalar
              scalar: text
          - name: yamlName
            type:
              kind: scalar
              scalar: text
          - name: pathName
            type:
              kind: scalar
              scalar: text
          - name: emptyForm
            type:
              kind: scalar
              scalar: text
          - name: policy
            type:
              kind: scalar
              scalar: text
          - name: expectedKind
            type:
              kind: scalar
              scalar: text
          - name: maxTextLength
            type:
              kind: scalar
              scalar: text
          - name: maxNumberDigits
            type:
              kind: scalar
              scalar: text
          - name: allowedTextLength
            type:
              kind: scalar
              scalar: text
          - name: owners
            type:
              kind: sequence
              item:
                kind: scalar
                scalar: text
