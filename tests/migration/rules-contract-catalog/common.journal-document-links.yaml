format: nkdk-declarations/1
kind: value
id: common.journal-document-links
imports:
  path: common.document-name-path
  rootKind: common.path-root
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
  xsi: http://www.w3.org/2001/XMLSchema-instance
inputs:
  roots:
    type:
      kind: index
      key:
        kind: record
        fields:
          - name: kind
            type:
              use: rootKind
          - name: name
            type:
              kind: scalar
              scalar: text
      value:
        kind: scalar
        scalar: text
value:
  kind: sequence
  item:
    use: path
representations:
  xml:
    kind: element-sequence
    path:
      - xr:Item
    item:
      kind: with-attributes
      attributes:
        - name: xsi:type
          value:
            qname: xr:MDObjectRef
      content:
        kind: text
  yaml:
    kind: sequence
    item:
      kind: scalar
      scalar: text
presence:
  - target: self
    xml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-element
          denotes:
            absent: true
      canonical:
        - when:
            not:
              present:
                self: true
          form: empty-element
        - form: ordinary
    yaml:
      missing:
        denotes:
          absent: true
      empty:
        - form: empty-sequence
          denotes:
            absent: true
      omitWhen:
        not:
          present:
            self: true
constraints:
  - id: target-exists
    appliesTo:
      - xml-import
      - yaml-validation
    assert:
      each:
        in:
          self: true
        as: path
        where:
          present:
            lookup:
              in:
                input: roots
              key:
                record:
                  kind:
                    literal: Document
                  name:
                    get:
                      of:
                        var: path
                      field: name
    diagnostic:
      code: metadata.target-missing
      severity: error
      at:
        self: true
      message: Target is missing
