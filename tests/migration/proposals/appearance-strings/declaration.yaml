format: nkdk-declarations/1
kind: catalog
declarations:
  - kind: value
    id: common.dcs-appearance-structured-string-value
    inputs:
      defaultLanguage:
        type:
          kind: scalar
          scalar: text
      registeredLanguages:
        type:
          kind: sequence
          item:
            kind: scalar
            scalar: text
    imports:
      source: common.dcs-design-time-choice
      kind: common.string
      content: common.dcs-appearance-string-content
    value:
      kind: record
      fields:
        - name: source
          type:
            use: source
            bind:
              defaultLanguage:
                input: defaultLanguage
              registeredLanguages:
                input: registeredLanguages
        - name: kind
          type:
            use: kind
        - name: value
          type:
            use: content
            bind:
              defaultLanguage:
                input: defaultLanguage
              registeredLanguages:
                input: registeredLanguages
    representations:
      xml:
        kind: record
        fields:
          - field: source
            path: []
      yaml:
        kind: mapping
        fields:
          - field: kind
            key: Тип
          - field: value
            key: Значение
    presence:
      - target:
          field: source
        yaml:
          missing:
            denotes:
              if:
                and:
                  - present:
                      field: kind
                  - eq:
                      - field: kind
                      - literal: Поле
              then:
                variant:
                  name: field
                  value:
                    record:
                      kind:
                        literal: Поле
                      field:
                        variantValue:
                          value:
                            field: value
                          variant: text
              else:
                if:
                  and:
                    - present:
                        field: kind
                    - eq:
                        - field: kind
                        - literal: ФорматированнаяСтрока
                then:
                  variant:
                    name: formatted
                    value:
                      record:
                        kind:
                          literal: МногоязычнаяФорматированнаяСтрока
                        value:
                          record:
                            formatted:
                              literal: true
                            text:
                              variantValue:
                                value:
                                  field: value
                                variant: localized
                else:
                  if:
                    isVariant:
                      value:
                        field: value
                      variant: localized
                  then:
                    variant:
                      name: localized
                      value:
                        record:
                          kind:
                            literal: МногоязычнаяСтрока
                          value:
                            variant:
                              name: localized
                              value:
                                variantValue:
                                  value:
                                    field: value
                                  variant: localized
                  else:
                    variant:
                      name: text
                      value:
                        variantValue:
                          value:
                            field: value
                          variant: text
      - target:
          field: kind
        xml:
          missing:
            denotes:
              if:
                isVariant:
                  value:
                    field: source
                  variant: field
              then:
                literal: Поле
              else:
                if:
                  isVariant:
                    value:
                      field: source
                    variant: formatted
                then:
                  literal: ФорматированнаяСтрока
                else:
                  absent: true
        yaml:
          missing:
            denotes:
              absent: true
      - target:
          field: value
        xml:
          missing:
            denotes:
              if:
                isVariant:
                  value:
                    field: source
                  variant: field
              then:
                variant:
                  name: text
                  value:
                    get:
                      of:
                        variantValue:
                          value:
                            field: source
                          variant: field
                      field: field
              else:
                if:
                  isVariant:
                    value:
                      field: source
                    variant: formatted
                then:
                  variant:
                    name: localized
                    value:
                      get:
                        of:
                          get:
                            of:
                              variantValue:
                                value:
                                  field: source
                                variant: formatted
                            field: value
                        field: text
                else:
                  if:
                    isVariant:
                      value:
                        field: source
                      variant: localized
                  then:
                    variant:
                      name: localized
                      value:
                        variantValue:
                          value:
                            get:
                              of:
                                variantValue:
                                  value:
                                    field: source
                                  variant: localized
                              field: value
                          variant: localized
                  else:
                    variant:
                      name: text
                      value:
                        variantValue:
                          value:
                            field: source
                          variant: text
  - kind: value
    id: common.dcs-appearance-string-value
    namespaces:
      xsi: http://www.w3.org/2001/XMLSchema-instance
      xs: http://www.w3.org/2001/XMLSchema
      v8: http://v8.1c.ru/8.1/data/core
      dcscor: http://v8.1c.ru/8.1/data-composition-system/core
    inputs:
      defaultLanguage:
        type:
          kind: scalar
          scalar: text
      registeredLanguages:
        type:
          kind: sequence
          item:
            kind: scalar
            scalar: text
    imports:
      text: common.dcs-appearance-plain-string
      structured: common.dcs-appearance-structured-string-value
    value:
      kind: choice
      variants:
        - name: text
          type:
            use: text
        - name: structured
          type:
            use: structured
            bind:
              defaultLanguage:
                input: defaultLanguage
              registeredLanguages:
                input: registeredLanguages
    representations:
      xml:
        kind: choice
        fallback: structured
      yaml:
        kind: choice
        variants:
          - variant: structured
            form: mapping
        fallback: text
  - kind: value
    id: common.dcs-appearance-plain-string
    namespaces:
      xsi: http://www.w3.org/2001/XMLSchema-instance
      xs: http://www.w3.org/2001/XMLSchema
    value:
      kind: scalar
      scalar: text
    representations:
      xml:
        kind: with-attributes
        attributes:
          - name: xsi:type
            value:
              qname: xs:string
        content:
          kind: text
      yaml:
        kind: scalar
        scalar: text
