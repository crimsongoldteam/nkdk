ИспользованиеДляГруппИЭлементов: Элементы
РежимОткрытияОкнаФормы: БлокироватьОкноВладельца
Элементы:
  Код:
    Вид: ПолеВвода
    РасширенноеРедактированиеМножественныхЗначений: Истина
    РежимРедактирования: ВходПриВводе
  Наименование:
    Вид: ПолеВвода
    РасширенноеРедактированиеМножественныхЗначений: Истина
    РежимРедактирования: ВходПриВводе
  ПараметрВыбораNil:
    Вид: ПолеВвода
