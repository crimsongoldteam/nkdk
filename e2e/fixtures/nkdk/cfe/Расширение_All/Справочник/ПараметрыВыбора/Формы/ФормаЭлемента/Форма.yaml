      Отбор.Ссылка:
    РасширенноеРедактированиеМножественныхЗначений: Истина
    РежимРедактирования: ВходПриВводе
Изменять:
  - Форма
"@Form": !xml/raw
  $xml:
    BaseForm:
      _version: "2.20"
      WindowOpeningMode: LockOwnerWindow
      UseForFoldersAndItems: Items
      AutoCommandBar:
        _name: ФормаКоманднаяПанель
        _id: "-1"
      ChildItems:
        InputField:
          - _name: Код
            _id: "1"
            EditMode: EnterOnInput
            ExtendedEditMultipleValues: "true"
            ContextMenu:
              _name: КодКонтекстноеМеню
              _id: "2"
            ExtendedTooltip:
              _name: КодРасширеннаяПодсказка
              _id: "3"
          - _name: Наименование
            _id: "4"
            EditMode: EnterOnInput
            ExtendedEditMultipleValues: "true"
            ContextMenu:
              _name: НаименованиеКонтекстноеМеню
              _id: "5"
            ExtendedTooltip:
              _name: НаименованиеРасширеннаяПодсказка
              _id: "6"
          - _name: ПараметрВыбораNil
            _id: "7"
            EditMode: EnterOnInput
            ExtendedEditMultipleValues: "true"
            ChoiceParameters:
              app:item:
                _name: Отбор.Ссылка
                app:value:
                  _xsi:nil: "true"
            ContextMenu:
              _name: ПараметрВыбораNilКонтекстноеМеню
              _id: "8"
            ExtendedTooltip:
              _name: ПараметрВыбораNilРасширеннаяПодсказка
              _id: "9"
      Attributes:
    "#order":
      - WindowOpeningMode
      - UseForFoldersAndItems
      - AutoCommandBar
      - ChildItems
      - Attributes
      - BaseForm