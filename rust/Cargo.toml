[workspace]
members = ["crates/decimal", "crates/rule-model", "crates/rule-compiler", "crates/conversion-core", "crates/compiled-rules", "apps/nkdk", "tools/dev"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
publish = false

[workspace.dependencies]
nkdk-rule-model = { path = "crates/rule-model" }
yaml-rust2 = { version = "=0.11.0", path = "../third-party/yaml-rust2" }
nkdk-decimal = { path = "crates/decimal" }
