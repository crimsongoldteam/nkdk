[workspace]
members = ["crates/decimal", "crates/rule-model", "crates/rule-compiler", "crates/conversion-core", "crates/compiled-rules", "crates/compiled-rules-base", "crates/compiled-rules-elements", "crates/compiled-rules-elements-2", "crates/compiled-rules-bodies", "crates/compiled-rules-bodies-2", "crates/compiled-rules-bodies-3", "crates/compiled-rules-bodies-4", "crates/compiled-rules-bodies-5", "crates/compiled-rules-owners", "crates/compiled-rules-owners-2", "crates/compiled-rules-owners-3", "crates/compiled-rules-members", "crates/compiled-rules-members-2", "crates/compiled-rules-inputs", "crates/compiled-rules-inputs-2", "crates/compiled-rules-probes", "crates/compiled-rules-font", "crates/compiled-rules-picture", "crates/compiled-rules-fields", "crates/probe-*", "crates/candidate-*", "crates/system-enum-shards/*", "apps/nkdk", "tools/dev", "generated-aot/*", "generated-aot/*/packages/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
publish = false

[workspace.dependencies]
nkdk-rule-model = { path = "crates/rule-model" }
yaml-rust2 = { version = "=0.11.0", path = "../third-party/yaml-rust2" }
nkdk-decimal = { path = "crates/decimal" }

[workspace.lints.rust]
unused_mut = "allow"
unused_variables = "allow"
unreachable_code = "allow"

[workspace.lints.clippy]
blocks_in_conditions = "allow"
collapsible_if = "allow"
comparison_to_empty = "allow"
large_enum_variant = "allow"
map_identity = "allow"
mixed_attributes_style = "allow"
module_inception = "allow"
needless_borrow = "allow"
needless_question_mark = "allow"
possible_missing_else = "allow"
string_extend_chars = "allow"
useless_asref = "allow"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Optimize the build-time compiler and automata construction, not the converter.
[profile.dev.build-override]
opt-level = 2

[profile.test.build-override]
opt-level = 2
