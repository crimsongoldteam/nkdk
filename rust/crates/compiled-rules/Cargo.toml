[package]
name = "nkdk-compiled-rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false
# Generated declarations are exercised by tests/*.rs. The library has no unit tests;
# avoid compiling the entire catalog again as an empty unit-test executable.
[lib]
test = false

[lints]
workspace = true

[dependencies]
nkdk-conversion-core = { path = "../conversion-core" }
[build-dependencies]
nkdk-rule-compiler = { path = "../rule-compiler" }

[dev-dependencies]
serde_json = { version = "=1.0.150", features = ["arbitrary_precision"] }

[[test]]
name = "standard_attributes"
path = "tests/standard_attributes.rs"
