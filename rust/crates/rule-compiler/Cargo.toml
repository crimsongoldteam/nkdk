[package]
name = "nkdk-rule-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
sha2 = "=0.10.9"
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "unicode", "dfa-build"] }
regex-syntax = "=0.8.11"
nkdk-conversion-core = { path = "../conversion-core" }
nkdk-decimal.workspace = true
nkdk-rule-model.workspace = true
yaml-rust2.workspace = true
serde_json = { version = "=1.0.150", features = ["arbitrary_precision"] }

[dev-dependencies]
# Recursive schema nodes must be shared; 0.30 repeatedly expands them during validation.
jsonschema = { version = "=0.47.0", default-features = false }
