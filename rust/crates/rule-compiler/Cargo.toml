[package]
name = "nkdk-rule-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "unicode", "dfa-build"] }
nkdk-conversion-core = { path = "../conversion-core" }
nkdk-decimal.workspace = true
nkdk-rule-model.workspace = true
yaml-rust2.workspace = true
serde_json = { version = "=1.0.150", features = ["arbitrary_precision"] }

[dev-dependencies]
jsonschema = { version = "=0.30.0", default-features = false }
