format: nkdk-declarations/1
kind: catalog
declarations:
- kind: value
  id: test.hidden-text
  value: {kind: scalar, scalar: text}
  representations: {xml: {kind: text}, yaml: {kind: scalar, scalar: text}}
- kind: value
  id: test.hidden-row
  imports: {text: test.hidden-text}
  value: {kind: sequence, item: {kind: record, fields: [{name: key, type: {kind: scalar, scalar: text}}, {name: text, type: {kind: scalar, scalar: text}}]}}
  representations:
    xml: {kind: element-sequence, path: [Item], item: {kind: record, fields: [{field: key, path: [Key]}, {field: text, path: [Text]}]}}
    yaml: {kind: keyed-mapping, key: key, value: text}
- kind: value
  id: test.hidden-choice
  namespaces: {xsi: 'http://www.w3.org/2001/XMLSchema-instance', t: 'urn:test'}
  imports: {row: test.hidden-row}
  value: {kind: choice, variants: [{name: row, type: {use: row}}]}
  representations:
    xml: {kind: choice, attribute: xsi:type, variants: [{variant: row, in: [t:Row], emit: t:Row}], otherwise: row}
    yaml: {kind: choice, variants: [{variant: row, form: mapping}]}
- kind: object
  id: test.hidden-owner
  imports: {source: test.hidden-choice}
  inputs:
    rows:
      type: {kind: sequence, item: {kind: record, fields: [{name: key, type: {kind: scalar, scalar: text}}, {name: text, type: {kind: scalar, scalar: text}}]}}
  value: {kind: record, fields: [{name: source, type: {use: source}}]}
  representations:
    xml: {kind: record, fields: [{field: source, path: [Root, Source]}]}
    yaml: {kind: mapping, fields: [{field: source, key: Source}]}
  presence:
  - target: {field: source}
    yaml: {missing: {denotes: {variant: {name: row, value: {input: rows}}}}}
