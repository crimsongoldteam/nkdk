format: nkdk-declarations/1
kind: catalog
declarations:
- kind: value
  id: test.hidden-text
  value: {kind: scalar, scalar: text}
  representations: {xml: {kind: text}, yaml: {kind: scalar, scalar: text}}
- kind: value
  id: test.hidden-row
  inputs: {fallback: {type: {kind: scalar, scalar: text}}}
  imports: {text: test.hidden-text}
  value: {kind: record, fields: [{name: label, type: {use: text}}]}
  representations:
    xml: {kind: record, fields: [{field: label, path: [Label]}]}
    yaml: {kind: mapping, fields: [{field: label, key: Label}]}
  presence: [{target: {field: label}, xml: {missing: {denotes: {input: fallback}}}}]
- kind: value
  id: test.hidden-choice
  inputs: {fallback: {type: {kind: scalar, scalar: text}}}
  namespaces: {xsi: 'http://www.w3.org/2001/XMLSchema-instance', t: 'urn:test'}
  imports: {row: test.hidden-row}
  value: {kind: choice, variants: [{name: row, type: {use: row, bind: {fallback: {input: fallback}}}}]}
  representations:
    xml: {kind: choice, attribute: xsi:type, variants: [{variant: row, in: [t:Row], emit: t:Row}], otherwise: row}
    yaml: {kind: choice, variants: [{variant: row, form: mapping, key: Label}]}
- kind: value
  id: test.hidden-outer
  inputs: {fallback: {type: {kind: scalar, scalar: text}}}
  imports: {inner: test.hidden-choice}
  value: {kind: choice, variants: [{name: nested, type: {use: inner, bind: {fallback: {input: fallback}}}}]}
  representations: {xml: {kind: choice, fallback: nested}, yaml: {kind: choice, variants: [{variant: nested, form: mapping, key: Label}], fallback: nested}}
- kind: object
  id: test.hidden-owner
  inputs: {fallback: {type: {kind: scalar, scalar: text}}}
  imports: {source: test.hidden-outer, text: test.hidden-text}
  value:
    kind: record
    fields: [{name: source, type: {use: source, bind: {fallback: {input: fallback}}}}, {name: label, type: {use: text}}]
  representations:
    xml: {kind: record, fields: [{field: source, path: [Root, Source]}]}
    yaml: {kind: mapping, fields: [{field: label, key: Label}]}
  presence:
  - target: {field: source}
    yaml: {missing: {denotes: {variant: {name: nested, value: {variant: {name: row, value: {record: {label: {field: label}}}}}}}}}
  - target: {field: label}
    xml: {missing: {denotes: {get: {of: {variantValue: {value: {variantValue: {value: {field: source}, variant: nested}}, variant: row}}, field: label}}}}
