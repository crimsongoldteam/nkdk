format: nkdk-declarations/1
kind: catalog
declarations:
- kind: value
  id: test.hidden-text
  value: {kind: scalar, scalar: text}
  representations: {xml: {kind: text}, yaml: {kind: scalar, scalar: text}}
- kind: value
  id: test.hidden-row
  imports: {text: test.hidden-text}
  value: {kind: record, fields: [{name: label, type: {use: text}}]}
  representations:
    xml: {kind: record, fields: [{field: label, path: [Label]}]}
    yaml: {kind: mapping, fields: [{field: label, key: Label}]}
- kind: value
  id: test.hidden-other-row
  imports: {text: test.hidden-text}
  value: {kind: record, fields: [{name: label, type: {use: text}}]}
  representations:
    xml: {kind: record, fields: [{field: label, path: [Label]}]}
    yaml: {kind: mapping, fields: [{field: label, key: Alternative}]}
- kind: value
  id: test.hidden-choice
  namespaces: {xsi: 'http://www.w3.org/2001/XMLSchema-instance', t: 'urn:test'}
  imports: {row: test.hidden-row, other: test.hidden-other-row}
  value: {kind: choice, variants: [{name: row, type: {use: row}}, {name: other, type: {use: other}}]}
  representations:
    xml: {kind: choice, attribute: xsi:type, variants: [{variant: row, in: [t:Row], emit: t:Row}, {variant: other, in: [t:Other], emit: t:Other}], otherwise: row}
    yaml: {kind: choice, variants: [{variant: row, form: mapping, key: Label}, {variant: other, form: mapping, key: Alternative}]}
- kind: value
  id: test.hidden-outer
  imports: {inner: test.hidden-choice}
  value: {kind: choice, variants: [{name: nested, type: {use: inner}}]}
  representations: {xml: {kind: choice, fallback: nested}, yaml: {kind: choice, variants: [{variant: nested, form: mapping, key: Label}], fallback: nested}}
- kind: object
  id: test.hidden-owner
  imports: {outer: test.hidden-outer, inner: test.hidden-choice}
  value: {kind: record, fields: [{name: source, type: {use: outer}}, {name: visible, type: {use: inner}}]}
  representations:
    xml: {kind: record, fields: [{field: source, path: [Root, Source]}]}
    yaml: {kind: mapping, fields: [{field: visible, key: Visible}]}
  presence:
  - target: {field: source}
    yaml: {missing: {denotes: {variant: {name: nested, value: {field: visible}}}}}
  - target: {field: visible}
    xml: {missing: {denotes: {variantValue: {value: {field: source}, variant: nested}}}}
