format: nkdk-declarations/1
kind: object
id: migration.document-commands
imports:
  commands: fragment.document-commands
  rootKind: common.path-root
inputs:
  defaultLanguage:
    type:
      kind: scalar
      scalar: text
  registeredLanguages:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
  roots:
    index: metadata.roots
  identities:
    index: metadata.own-identities
  baseIds:
    index: metadata.base-identities
  component:
    type:
      kind: scalar
      scalar: text
  owner:
    type:
      kind: scalar
      scalar: text
value:
  kind: record
  fields: []
representations:
  xml:
    kind: record
    fields: []
  yaml:
    kind: mapping
    fields: []
namespaces:
  md: http://v8.1c.ru/8.3/MDClasses
compose:
- use: commands
  bind:
    defaultLanguage:
      input: defaultLanguage
    registeredLanguages:
      input: registeredLanguages
    roots:
      input: roots
    identities:
      input: identities
    baseIds:
      input: baseIds
    component:
      input: component
    owner:
      input: owner
