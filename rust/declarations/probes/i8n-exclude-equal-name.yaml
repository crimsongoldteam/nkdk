format: nkdk-declarations/1
kind: object
id: migration.i8n-text-probe.exclude-equal-name
imports: {text: common.i8n-text}
inputs:
  defaultLanguage: {type: {kind: scalar, scalar: text}}
  registeredLanguages: {type: {kind: sequence, item: {kind: scalar, scalar: text}}}
  name: {type: {kind: scalar, scalar: text}}
value:
  kind: record
  fields:
    - name: title
      type:
        use: text
        with: {excludeIfEqualNameYAML: true}
        bind:
          defaultLanguage: {input: defaultLanguage}
          registeredLanguages: {input: registeredLanguages}
          ownerName: {input: name}
representations:
  xml:
    kind: record
    fields: [{field: title, path: [Root, Title]}]
  yaml:
    kind: mapping
    fields: [{field: title, key: Заголовок}]
