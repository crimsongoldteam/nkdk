format: nkdk-declarations/1
kind: catalog
declarations:
- kind: value
  id: probe.default-number
  value: {kind: scalar, scalar: number, profile: decimal}
  representations: {xml: {kind: text}, yaml: {kind: scalar, scalar: number}}
- kind: value
  id: probe.default-text
  value: {kind: scalar, scalar: text, pattern: '.*'}
  representations: {xml: {kind: text}, yaml: {kind: scalar, scalar: text}}
- kind: value
  id: probe.default-pattern
  value: {kind: record, fields: [{name: name, type: {kind: scalar, scalar: text}}]}
  representations:
    xml: {kind: text-pattern, parts: [{literal: 'Ref.'}, {field: name}]}
    yaml: {kind: text-pattern, parts: [{literal: 'Ссылка.'}, {field: name}]}
- kind: value
  id: probe.default-choice
  namespaces: {xsi: http://www.w3.org/2001/XMLSchema-instance, xs: http://www.w3.org/2001/XMLSchema}
  imports: {number: probe.default-number, text: probe.default-text, pattern: probe.default-pattern}
  value: {kind: choice, variants: [{name: number, type: {use: number}}, {name: text, type: {use: text}}, {name: pattern, type: {use: pattern}}]}
  representations:
    xml:
      kind: choice
      attribute: xsi:type
      variants:
      - {variant: number, in: [xs:decimal], emit: xs:decimal}
      - {variant: text, in: [xs:string], emit: xs:string}
      - {variant: pattern, in: [xs:record], emit: xs:record}
      otherwise: text
    yaml: {kind: choice}
- kind: object
  id: probe.choice-default
  imports: {choice: probe.default-choice}
  value: {kind: record, fields: [{name: value, type: {use: choice}}]}
  representations:
    xml: {kind: record, fields: [{field: value, path: [Root, Value]}]}
    yaml: {kind: mapping, fields: [{field: value, key: Значение}]}
  presence:
  - target: {field: value}
    yaml:
      missing: {denotes: {variant: {name: number, value: {literal: 0}}}}
      omitWhen:
        and:
        - {isVariant: {value: {field: value}, variant: number}}
        - {eq: [{variantValue: {value: {field: value}, variant: number}}, {literal: 0}]}
