format: nkdk-declarations/1
kind: object
id: migration.metadata-uuid
imports: {uuid: common.uuid}
inputs:
  identities: {index: metadata.own-identities}
  component: {type: {kind: scalar, scalar: text}}
  owner: {type: {kind: scalar, scalar: text}}
  kind: {type: {kind: scalar, scalar: text}}
value:
  kind: record
  fields:
  - {name: name, type: {kind: scalar, scalar: text}}
  - name: uuid
    type:
      use: uuid
      bind:
        identities: {input: identities}
        component: {input: component}
        owner: {input: owner}
        kind: {input: kind}
        name: {field: name}
representations:
  xml: {kind: record, fields: [{field: name, path: [Root, Name]}, {field: uuid, path: [Root], attribute: uuid}]}
  yaml: {kind: mapping, fields: [{field: name, key: Имя}]}
contributions:
- index: metadata.own-identities
  key:
    record:
      component: {input: component}
      owner: {input: owner}
      kind: {input: kind}
      name: {field: name}
  value: {field: uuid}
