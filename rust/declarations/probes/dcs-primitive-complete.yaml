format: nkdk-declarations/1
kind: catalog
declarations:
- kind: object
  id: migration.dcs-primitive-complete
  imports: {value: common.dcs-primitive-value, text: common.string}
  inputs:
    defaultLanguage: {type: {kind: scalar, scalar: text}}
    registeredLanguages: {type: {kind: sequence, item: {kind: scalar, scalar: text}}}
    labels: {index: dcs.enumeration-labels}
    codes: {index: dcs.enumeration-codes}
  value:
    kind: record
    fields:
    - {name: value, type: {use: value, bind: {defaultLanguage: {input: defaultLanguage}, registeredLanguages: {input: registeredLanguages}, labels: {input: labels}, codes: {input: codes}}}}
    - {name: other, type: {use: text}}
  representations:
    xml: {kind: record, fields: [{field: value, path: [Root, Value]}, {field: other, path: [Root, Other]}]}
    yaml: {kind: mapping, fields: [{field: value, key: Значение}, {field: other, key: Сосед}]}
  presence:
  - target: {field: other}
    xml: {missing: {denotes: {absent: true}}}
    yaml: {missing: {denotes: {absent: true}}}
