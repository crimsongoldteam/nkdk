format: nkdk-declarations/1
kind: object
id: migration.metadata-value
imports: {typeDescription: common.type-description, value: common.metadata-value}
inputs:
  defaultLanguage: {type: {kind: scalar, scalar: text}}
  registeredLanguages: {type: {kind: sequence, item: {kind: scalar, scalar: text}}}
value:
  kind: record
  fields:
  - {name: type, type: {use: typeDescription}}
  - name: value
    type:
      use: value
      with: {exportNilValue: true}
      bind:
        defaultLanguage: {input: defaultLanguage}
        registeredLanguages: {input: registeredLanguages}
        onlyStringType:
          and:
          - {present: {field: type}}
          - one: {in: {get: {of: {field: type}, field: items}}, as: item, where: {literal: true}}
          - exists:
              in: {get: {of: {field: type}, field: items}}
              as: item
              where: {eq: [{get: {of: {var: item}, field: value}}, {literal: Строка}]}
representations:
  xml:
    kind: record
    fields:
    - {field: type, path: [Root, Type]}
    - {field: value, path: [Root, FillValue]}
  yaml:
    kind: mapping
    fields:
    - {field: type, key: Тип}
    - {field: value, key: Значение}
