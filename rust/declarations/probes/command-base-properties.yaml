format: nkdk-declarations/1
kind: object
id: migration.command-base-properties
imports: {base: fragment.command-base-properties, module: fragment.command-module-resource}
namespaces: {md: 'http://v8.1c.ru/8.3/MDClasses'}
inputs:
  name: {type: {kind: scalar, scalar: text}}
  identity: {type: {kind: scalar, scalar: text}}
  defaultLanguage: {type: {kind: scalar, scalar: text}}
  registeredLanguages: {type: {kind: sequence, item: {kind: scalar, scalar: text}}}
  roots: {index: metadata.roots}
compose:
- {use: module, bind: {name: {input: name}}}
- {use: base, bind: {name: {input: name}, defaultLanguage: {input: defaultLanguage}, registeredLanguages: {input: registeredLanguages}, roots: {input: roots}}}
value: {kind: record, fields: [{name: uuid, type: {kind: scalar, scalar: text}}]}
representations:
  xml: {kind: record, fields: [{field: uuid, path: [md:Command], attribute: uuid}]}
  yaml: {kind: mapping, fields: [{field: uuid, key: Идентификатор}]}
presence:
- target: {field: uuid}
  xml: {missing: {denotes: {absent: true}}}
  yaml: {default: {input: identity}}
