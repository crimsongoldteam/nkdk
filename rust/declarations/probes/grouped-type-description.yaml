format: nkdk-declarations/1
kind: object
id: migration.grouped-type-description
namespaces:
  v8: http://v8.1c.ru/8.1/data/core
  xr: http://v8.1c.ru/8.3/xcf/readable
  xsi: http://www.w3.org/2001/XMLSchema-instance
imports: {description: common.type-description}
value:
  kind: record
  fields:
  - {name: check, type: {use: description, with: {addTypeDescriptionAttributeToXML: true}}}
  - {name: notify, type: {use: description, with: {addTypeDescriptionAttributeToXML: true}}}
  - {name: extend, type: {use: description, with: {addTypeDescriptionAttributeToXML: true}}}
representations:
  xml:
    kind: record
    fields:
    - {field: check, path: [Root, xr:CheckValue]}
    - {field: notify, path: [Root, xr:NotifyValue]}
    - {field: extend, path: [Root, xr:ExtendValue]}
  yaml:
    kind: grouped-sequence
    groups:
    - {field: check}
    - {field: notify, itemTag: проверять}
    - {field: extend, itemTag: изменять}
presence:
- target: {field: check}
  xml: {missing: {denotes: {absent: true}}}
  yaml: {missing: {denotes: {absent: true}}}
- target: {field: notify}
  xml: {missing: {denotes: {absent: true}}}
  yaml: {missing: {denotes: {absent: true}}}
- target: {field: extend}
  xml: {missing: {denotes: {absent: true}}}
  yaml: {missing: {denotes: {absent: true}}}
