format: nkdk-declarations/1
kind: object
id: migration.command-collection
imports:
  rows: metadata.command-rows
  rootKind: common.path-root
inputs:
  defaultLanguage:
    type:
      kind: scalar
      scalar: text
  registeredLanguages:
    type:
      kind: sequence
      item:
        kind: scalar
        scalar: text
  roots:
    index: metadata.roots
  identities:
    index: metadata.own-identities
  baseIds:
    index: metadata.base-identities
  component:
    type:
      kind: scalar
      scalar: text
  owner:
    type:
      kind: scalar
      scalar: text
value:
  kind: record
  fields:
  - name: commands
    type:
      use: rows
      bind:
        defaultLanguage:
          input: defaultLanguage
        registeredLanguages:
          input: registeredLanguages
        roots:
          input: roots
        identities:
          input: identities
        baseIds:
          input: baseIds
        component:
          input: component
        owner:
          input: owner
representations:
  xml:
    kind: record
    fields:
    - field: commands
      path:
      - Root
      - ChildObjects
  yaml:
    kind: mapping
    fields:
    - field: commands
      key: Команды
namespaces:
  md: http://v8.1c.ru/8.3/MDClasses
