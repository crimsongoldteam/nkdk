  fields:
  - {name: DefaultObjectForm, type: {use: link, bind: {owner: {input: ownerPath}, forms: {input: forms}}}}
  - {name: DefaultListForm, type: {use: link, bind: {owner: {input: ownerPath}, forms: {input: forms}}}}
  - {name: DefaultChoiceForm, type: {use: choice, bind: {owner: {input: ownerName}, forms: {input: forms}, roots: {input: roots}, formTargets: {input: formTargets}}}}
