format: nkdk-declarations/1
kind: fragment
id: fragment.child-template-resources
inputs:
  names: {type: {kind: sequence, item: {kind: scalar, scalar: text}}}
value: {kind: record, fields: []}
representations:
  xml: {kind: record, fields: []}
  yaml: {kind: mapping, fields: []}
resources:
- forEach: {in: {input: names}, as: name}
  oneOf:
  - xml: {sequence: [{literal: Templates}, {concat: [{var: name}, {literal: '.xml'}]}]}
    yaml: {sequence: [{literal: Шаблоны}, {var: name}, {literal: Template.xml}]}
- forEach: {in: {input: names}, as: name}
  oneOf:
  - xml: {sequence: [{literal: Templates}, {var: name}, {literal: Ext}, {literal: Template.txt}]}
    yaml: {sequence: [{literal: Шаблоны}, {var: name}, {literal: Template.txt}]}
- forEach: {in: {input: names}, as: name}
  oneOf:
  - xml: {sequence: [{literal: Templates}, {var: name}, {literal: Ext}, {literal: Template.bin}]}
    yaml: {sequence: [{literal: Шаблоны}, {var: name}, {literal: Template.bin}]}
- forEach: {in: {input: names}, as: name}
  remainder:
    xml: {sequence: [{literal: Templates}, {var: name}]}
    yaml: {sequence: [{literal: Шаблоны}, {var: name}]}
