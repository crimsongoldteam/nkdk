format: nkdk-declarations/1
kind: fragment
id: fragment.journal-base-properties
imports: {string: common.string, text: common.i8n-text, boolean: common.boolean, links: common.journal-document-links, rootKind: common.path-root, belonging: system.ObjectBelonging}
namespaces: {md: 'http://v8.1c.ru/8.3/MDClasses'}
inputs:
  name: {type: {kind: scalar, scalar: text}}
  owner: {type: {kind: scalar, scalar: text}}
  component: {type: {kind: scalar, scalar: text}}
  adopted: {type: {kind: scalar, scalar: boolean}}
  baseIds:
    type:
      kind: index
      key:
        kind: record
        fields:
        - {name: component, type: {kind: scalar, scalar: text}}
        - {name: identity, type: {kind: scalar, scalar: text}}
      value: {kind: scalar, scalar: text}
  defaultLanguage: {type: {kind: scalar, scalar: text}}
  registeredLanguages: {type: {kind: sequence, item: {kind: scalar, scalar: text}}}
  roots:
    type:
      kind: index
      key: {kind: record, fields: [{name: kind, type: {use: rootKind}}, {name: name, type: {kind: scalar, scalar: text}}]}
      value: {kind: scalar, scalar: text}
value:
  kind: record
  fields:
  - {name: ObjectBelonging, type: {use: belonging}}
  - {name: Name, type: {kind: scalar, scalar: text}}
  - {name: Synonym, type: {use: text, with: {excludeIfEqualNameYAML: true}, bind: {defaultLanguage: {input: defaultLanguage}, registeredLanguages: {input: registeredLanguages}, ownerName: {if: {input: adopted}, then: {literal: ''}, else: {input: name}}}}}
  - {name: Comment, type: {use: string}}
  - {name: ExtendedConfigurationObject, type: {use: string}}
  - {name: UseStandardCommands, type: {use: boolean}}
  - {name: RegisteredDocuments, type: {use: links, bind: {roots: {input: roots}}}}
  - {name: IncludeHelpInContents, type: {use: boolean}}
  - {name: ListPresentation, type: {use: text, with: {preserveEmptyXML: true}, bind: {defaultLanguage: {input: defaultLanguage}, registeredLanguages: {input: registeredLanguages}, ownerName: {input: name}}}}
  - {name: ExtendedListPresentation, type: {use: text, with: {preserveEmptyXML: true}, bind: {defaultLanguage: {input: defaultLanguage}, registeredLanguages: {input: registeredLanguages}, ownerName: {input: name}}}}
  - {name: Explanation, type: {use: text, with: {preserveEmptyXML: true}, bind: {defaultLanguage: {input: defaultLanguage}, registeredLanguages: {input: registeredLanguages}, ownerName: {input: name}}}}
representations:
  xml:
    kind: record
    fields:
    - {field: ObjectBelonging, path: ['md:MetaDataObject', 'md:DocumentJournal', 'md:Properties', 'md:ObjectBelonging']}
    - {field: Name, path: ['md:MetaDataObject', 'md:DocumentJournal', 'md:Properties', 'md:Name']}
    - {field: Synonym, path: ['md:MetaDataObject', 'md:DocumentJournal', 'md:Properties', 'md:Synonym']}
    - {field: Comment, path: ['md:MetaDataObject', 'md:DocumentJournal', 'md:Properties', 'md:Comment']}
    - {field: ExtendedConfigurationObject, path: ['md:MetaDataObject', 'md:DocumentJournal', 'md:Properties', 'md:ExtendedConfigurationObject']}
    - {field: UseStandardCommands, path: ['md:MetaDataObject', 'md:DocumentJournal', 'md:Properties', 'md:UseStandardCommands']}
    - {field: RegisteredDocuments, path: ['md:MetaDataObject', 'md:DocumentJournal', 'md:Properties', 'md:RegisteredDocuments']}
    - {field: IncludeHelpInContents, path: ['md:MetaDataObject', 'md:DocumentJournal', 'md:Properties', 'md:IncludeHelpInContents']}
    - {field: ListPresentation, path: ['md:MetaDataObject', 'md:DocumentJournal', 'md:Properties', 'md:ListPresentation']}
    - {field: ExtendedListPresentation, path: ['md:MetaDataObject', 'md:DocumentJournal', 'md:Properties', 'md:ExtendedListPresentation']}
    - {field: Explanation, path: ['md:MetaDataObject', 'md:DocumentJournal', 'md:Properties', 'md:Explanation']}
  yaml:
    kind: mapping
    fields:
    - {field: Name, key: Имя}
    - {field: Synonym, key: Синоним}
    - {field: Comment, key: Комментарий}
    - {field: UseStandardCommands, key: ИспользоватьСтандартныеКоманды}
    - {field: RegisteredDocuments, key: РегистрируемыеДокументы}
    - {field: IncludeHelpInContents, key: ВключатьСправкуВСодержание}
    - {field: ListPresentation, key: ПредставлениеСписка}
    - {field: ExtendedListPresentation, key: РасширенноеПредставлениеСписка}
    - {field: Explanation, key: Пояснение}
presence:
- target: {field: ObjectBelonging}
  xml: {missing: {denotes: {literal: Native}}, canonical: [{when: {eq: [{field: ObjectBelonging}, {literal: Native}]}, form: missing}]}
  yaml:
    missing:
      denotes:
        if: {present: {lookup: {in: {input: baseIds}, key: {record: {component: {input: component}, identity: {input: owner}}}}}}
        then: {literal: Adopted}
        else: {literal: Native}
- target: {field: Name}
  xml: {missing: {denotes: {absent: true}}}
  yaml: {default: {input: name}}
- target: {field: Comment}
  xml: {missing: {denotes: {absent: true}}}
  yaml: {default: {literal: ''}}
- target: {field: ExtendedConfigurationObject}
  xml: {missing: {denotes: {absent: true}}}
  yaml:
    missing:
      denotes:
        if: {present: {lookup: {in: {input: baseIds}, key: {record: {component: {input: component}, identity: {input: owner}}}}}}
        then: {require: {lookup: {in: {input: baseIds}, key: {record: {component: {input: component}, identity: {input: owner}}}}}}
        else: {absent: true}
- target: {field: UseStandardCommands}
  xml:
    missing: {denotes: {absent: true}}
    canonical:
    - {when: {and: [{eq: [{field: ObjectBelonging}, {literal: Adopted}]}, {eq: [{field: UseStandardCommands}, {literal: true}]}]}, form: missing}
    - {form: ordinary}
  yaml: {default: {literal: true}}
- target: {field: IncludeHelpInContents}
  xml:
    missing: {denotes: {absent: true}}
    canonical:
    - {when: {and: [{eq: [{field: ObjectBelonging}, {literal: Adopted}]}, {eq: [{field: IncludeHelpInContents}, {literal: false}]}]}, form: missing}
    - {form: ordinary}
  yaml: {default: {literal: false}}
- target: {field: RegisteredDocuments}
  xml:
    canonical:
    - {when: {and: [{eq: [{field: ObjectBelonging}, {literal: Adopted}]}, {not: {present: {field: RegisteredDocuments}}}]}, form: missing}
    - {when: {not: {present: {field: RegisteredDocuments}}}, form: empty-element}
    - {form: ordinary}
- target: {field: ListPresentation}
  xml:
    canonical:
    - {when: {and: [{eq: [{field: ObjectBelonging}, {literal: Adopted}]}, {not: {present: {field: ListPresentation}}}]}, form: missing}
    - {when: {not: {present: {field: ListPresentation}}}, form: empty-element}
    - {when: {and: [{one: {in: {field: ListPresentation}, as: translation, where: {literal: true}}}, {exists: {in: {field: ListPresentation}, as: translation, where: {eq: [{get: {of: {var: translation}, field: content}}, {literal: ''}]}}}]}, form: empty-element}
    - {form: ordinary}
  yaml:
    omitWhen: {and: [{not: {eq: [{field: ObjectBelonging}, {literal: Adopted}]}}, {one: {in: {field: ListPresentation}, as: translation, where: {literal: true}}}, {exists: {in: {field: ListPresentation}, as: translation, where: {eq: [{get: {of: {var: translation}, field: content}}, {literal: ''}]}}}]}
- target: {field: ExtendedListPresentation}
  xml:
    canonical:
    - {when: {and: [{eq: [{field: ObjectBelonging}, {literal: Adopted}]}, {not: {present: {field: ExtendedListPresentation}}}]}, form: missing}
    - {when: {not: {present: {field: ExtendedListPresentation}}}, form: empty-element}
    - {when: {and: [{one: {in: {field: ExtendedListPresentation}, as: translation, where: {literal: true}}}, {exists: {in: {field: ExtendedListPresentation}, as: translation, where: {eq: [{get: {of: {var: translation}, field: content}}, {literal: ''}]}}}]}, form: empty-element}
    - {form: ordinary}
  yaml:
    omitWhen: {and: [{not: {eq: [{field: ObjectBelonging}, {literal: Adopted}]}}, {one: {in: {field: ExtendedListPresentation}, as: translation, where: {literal: true}}}, {exists: {in: {field: ExtendedListPresentation}, as: translation, where: {eq: [{get: {of: {var: translation}, field: content}}, {literal: ''}]}}}]}
- target: {field: Explanation}
  xml:
    canonical:
    - {when: {and: [{eq: [{field: ObjectBelonging}, {literal: Adopted}]}, {not: {present: {field: Explanation}}}]}, form: missing}
    - {when: {not: {present: {field: Explanation}}}, form: empty-element}
    - {when: {and: [{one: {in: {field: Explanation}, as: translation, where: {literal: true}}}, {exists: {in: {field: Explanation}, as: translation, where: {eq: [{get: {of: {var: translation}, field: content}}, {literal: ''}]}}}]}, form: empty-element}
    - {form: ordinary}
  yaml:
    omitWhen: {and: [{not: {eq: [{field: ObjectBelonging}, {literal: Adopted}]}}, {one: {in: {field: Explanation}, as: translation, where: {literal: true}}}, {exists: {in: {field: Explanation}, as: translation, where: {eq: [{get: {of: {var: translation}, field: content}}, {literal: ''}]}}}]}
