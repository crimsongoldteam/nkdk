format: nkdk-declarations/1
kind: value
id: common.metadata-fields
namespaces: {xr: http://v8.1c.ru/8.3/xcf/readable}
imports: {field: common.metadata-field-chain-path}
value: {kind: sequence, item: {use: field}}
representations:
  xml: {kind: element-sequence, path: [xr:Field], item: {kind: with-attributes, attributes: [], content: {kind: text}}}
  yaml: {kind: sequence, item: {kind: scalar, scalar: text}}
presence:
- target: self
  xml:
    missing: {denotes: {absent: true}}
    empty:
    - {form: empty-element, denotes: {absent: true}}
  yaml:
    missing: {denotes: {absent: true}}
    empty:
    - {form: empty-sequence, denotes: {absent: true}}
    omitWhen: {not: {present: {self: true}}}
