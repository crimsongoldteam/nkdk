format: nkdk-declarations/1
kind: catalog
declarations:
- kind: value
  id: common.event-call-type
  enum:
    Before: Перед
    After: После
    Override: Вместо
- kind: value
  id: common.event-binding
  imports: {mode: common.event-call-type}
  value:
    kind: record
    fields:
    - {name: name, type: {kind: scalar, scalar: text}}
    - {name: mode, type: {use: mode}}
    - {name: handler, type: {kind: scalar, scalar: text}}
  representations:
    xml:
      kind: record
      fields:
      - {field: name, path: [], attribute: name}
      - {field: mode, path: [], attribute: callType}
      - {field: handler, path: []}
    yaml:
      kind: mapping
      fields:
      - {field: name, key: Имя}
      - {field: mode, key: Режим}
      - {field: handler, key: Обработчик}
  presence:
  - target: {field: mode}
    xml: {missing: {denotes: {absent: true}}}
    yaml: {missing: {denotes: {absent: true}}}
- kind: value
  id: common.event-bindings
  imports: {binding: common.event-binding}
  inputs:
    eventNames:
      type:
        kind: sequence
        item:
          kind: record
          fields:
          - {name: xml, type: {kind: scalar, scalar: text}}
          - {name: yaml, type: {kind: scalar, scalar: text}}
  value: {kind: sequence, item: {use: binding}}
  representations:
    xml: {kind: element-sequence, path: [Event]}
    yaml:
      kind: record-mapping
      key: name
      groupKey: mode
      value: handler
      keyTable: {input: eventNames, internal: xml, external: yaml}
- kind: value
  id: common.form-event-bindings
  imports: {binding: common.event-binding}
  namespaces: {f: 'http://v8.1c.ru/8.3/xcf/logform'}
  inputs:
    eventNames:
      type:
        kind: sequence
        item:
          kind: record
          fields:
          - {name: xml, type: {kind: scalar, scalar: text}}
          - {name: yaml, type: {kind: scalar, scalar: text}}
  value: {kind: sequence, item: {use: binding}}
  representations:
    xml: {kind: element-sequence, path: [f:Event]}
    yaml:
      kind: record-mapping
      key: name
      groupKey: mode
      value: handler
      keyTable: {input: eventNames, internal: xml, external: yaml}
