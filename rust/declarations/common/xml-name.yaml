format: nkdk-declarations/1
kind: catalog
declarations:
- kind: value
  id: common.xml-name-text
  imports: {name: common.metadata-name}
  value: {kind: record, fields: [{name: name, type: {use: name}}]}
  representations:
    xml: {kind: text-pattern, parts: [{field: name}]}
    yaml: {kind: text-pattern, parts: [{field: name}]}
- kind: value
  id: common.xml-name
  imports: {text: common.xml-name-text}
  value: {kind: choice, variants: [{name: explicit, type: {use: text}}]}
  representations:
    xml: {kind: choice}
    yaml:
      kind: choice
      variants: [{variant: explicit, form: scalar, tag: xml/name}]
