format: nkdk-declarations/1
kind: value
id: common.xdto-packages
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
  xsi: http://www.w3.org/2001/XMLSchema-instance
  xs: http://www.w3.org/2001/XMLSchema
value: {kind: sequence, item: {kind: scalar, scalar: text}}
representations:
  xml:
    kind: element-sequence
    path: [xr:Item]
    item:
      kind: tree
      children:
      - {name: xr:Presentation}
      - {name: xr:CheckState, text: '0'}
      - name: xr:Value
        self: true
        attributes:
        - name: xsi:type
          value: {qname: xr:MDObjectRef}
          when: {matches: {value: {self: true}, pattern: 'XDTOPackage\.[\s\S]*'}}
        - name: xsi:type
          value: {qname: xs:string}
          when: {not: {matches: {value: {self: true}, pattern: 'XDTOPackage\.[\s\S]*'}}}
  yaml: {kind: sequence, item: {kind: scalar, scalar: text}}
presence:
- target: self
  xml:
    missing: {denotes: {absent: true}}
    empty: [{form: empty-element, denotes: {absent: true}}]
  yaml:
    missing: {denotes: {absent: true}}
