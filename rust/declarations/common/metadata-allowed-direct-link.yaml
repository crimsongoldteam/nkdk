format: nkdk-declarations/1
kind: catalog
declarations:
- kind: value
  id: common.metadata-allowed-direct-object
  imports: {rootKind: common.path-root, name: common.metadata-name, memberKind: common.path-member-kind}
  inputs:
    allowedObjectRoots: {type: {kind: sequence, item: {use: rootKind}}}
    allowedMemberPaths:
      type:
        kind: sequence
        item: {kind: record, fields: [{name: root, type: {use: rootKind}}, {name: kind, type: {use: memberKind}}]}
    allowOwner: {type: {kind: scalar, scalar: boolean}}
  value:
    kind: record
    fields: [{name: root, type: {use: rootKind}}, {name: name, type: {use: name}}]
  representations:
    xml: {kind: text-pattern, separator: '.', parts: [{field: root}, {field: name}]}
    yaml: {kind: text-pattern, separator: '.', parts: [{field: root}, {field: name}]}
  constraints:
  - id: allowed-root
    appliesTo: [xml-import, yaml-validation]
    assert:
      or:
      - {exists: {in: {input: allowedObjectRoots}, as: allowed, where: {eq: [{var: allowed}, {get: {of: {self: true}, field: root}}]}}}
      - {and: [{input: allowOwner}, {exists: {in: {input: allowedMemberPaths}, as: allowed, where: {eq: [{get: {of: {var: allowed}, field: root}}, {get: {of: {self: true}, field: root}}]}}}]}
    diagnostic: {code: metadata.target-root, severity: error, at: {self: true}, message: Object root is not allowed}
- kind: value
  id: common.metadata-allowed-direct-member
  imports: {rootKind: common.path-root, name: common.metadata-name, memberKind: common.path-member-kind}
  inputs:
    allowedMemberPaths:
      type:
        kind: sequence
        item: {kind: record, fields: [{name: root, type: {use: rootKind}}, {name: kind, type: {use: memberKind}}]}
  value:
    kind: record
    fields:
    - {name: root, type: {use: rootKind}}
    - {name: owner, type: {use: name}}
    - {name: kind, type: {use: memberKind}}
    - {name: name, type: {use: name}}
  representations:
    xml: {kind: text-pattern, separator: '.', parts: [{field: root}, {field: owner}, {field: kind}, {field: name}]}
    yaml: {kind: text-pattern, separator: '.', parts: [{field: root}, {field: owner}, {field: kind}, {field: name}]}
  constraints:
  - id: allowed-member-path
    appliesTo: [xml-import, yaml-validation]
    assert:
      exists:
        in: {input: allowedMemberPaths}
        as: allowed
        where:
          and:
          - {eq: [{get: {of: {var: allowed}, field: root}}, {get: {of: {self: true}, field: root}}]}
          - {eq: [{get: {of: {var: allowed}, field: kind}}, {get: {of: {self: true}, field: kind}}]}
    diagnostic: {code: metadata.target-path, severity: error, at: {self: true}, message: Member path is not allowed}
- kind: value
  id: common.metadata-allowed-direct-link
  imports:
    object: common.metadata-allowed-direct-object
    member: common.metadata-allowed-direct-member
    empty: common.metadata-link-empty
    rootKind: common.path-root
    memberKind: common.path-member-kind
  inputs:
    allowedObjectRoots: {type: {kind: sequence, item: {use: rootKind}}}
    allowedMemberPaths:
      type:
        kind: sequence
        item: {kind: record, fields: [{name: root, type: {use: rootKind}}, {name: kind, type: {use: memberKind}}]}
    allowOwner: {type: {kind: scalar, scalar: boolean}}
  value:
    kind: choice
    variants:
    - {name: object, type: {use: object, bind: {allowedObjectRoots: {input: allowedObjectRoots}, allowedMemberPaths: {input: allowedMemberPaths}, allowOwner: {input: allowOwner}}}}
    - {name: member, type: {use: member, bind: {allowedMemberPaths: {input: allowedMemberPaths}}}}
    - {name: empty, type: {use: empty}}
  representations:
    xml: {kind: choice}
    yaml: {kind: choice}
