format: nkdk-declarations/1
kind: catalog
declarations:
- kind: value
  id: common.owner-standard-field-path
  imports: {root: common.path-root, name: common.standard-attribute-name, kind: common.path-standard-member-kind}
  inputs:
    ownerRoot: {type: {use: root}}
    ownerName: {type: {kind: scalar, scalar: text}}
  value:
    kind: record
    fields:
    - {name: root, type: {use: root}}
    - {name: owner, type: {use: name}}
    - {name: kind, type: {use: kind}}
    - {name: name, type: {use: name}}
  representations:
    xml: {kind: text-pattern, separator: '.', parts: [{field: root}, {field: owner}, {field: kind}, {field: name}]}
    yaml: {kind: text-pattern, separator: '.', parts: [{field: kind}, {field: name}]}
  presence:
  - {target: {field: root}, yaml: {default: {input: ownerRoot}}}
  - {target: {field: owner}, yaml: {default: {input: ownerName}}}
  constraints:
  - id: containing-owner
    appliesTo: [xml-import, yaml-validation]
    assert:
      and:
      - {eq: [{get: {of: {self: true}, field: root}}, {input: ownerRoot}]}
      - {eq: [{get: {of: {self: true}, field: owner}}, {input: ownerName}]}
    diagnostic: {code: metadata.target-missing, severity: error, at: {self: true}, message: Expected a field of the containing object}
- kind: value
  id: common.owner-ordinary-field-path
  imports: {root: common.path-root, name: common.metadata-name, kind: common.path-ordinary-member-kind}
  inputs:
    ownerRoot: {type: {use: root}}
    ownerName: {type: {kind: scalar, scalar: text}}
  value:
    kind: record
    fields:
    - {name: root, type: {use: root}}
    - {name: owner, type: {use: name}}
    - {name: kind, type: {use: kind}}
    - {name: name, type: {use: name}}
  representations:
    xml: {kind: text-pattern, separator: '.', parts: [{field: root}, {field: owner}, {field: kind}, {field: name}]}
    yaml: {kind: text-pattern, separator: '.', parts: [{field: kind}, {field: name}]}
  presence:
  - {target: {field: root}, yaml: {default: {input: ownerRoot}}}
  - {target: {field: owner}, yaml: {default: {input: ownerName}}}
  constraints:
  - id: containing-owner
    appliesTo: [xml-import, yaml-validation]
    assert:
      and:
      - {eq: [{get: {of: {self: true}, field: root}}, {input: ownerRoot}]}
      - {eq: [{get: {of: {self: true}, field: owner}}, {input: ownerName}]}
    diagnostic: {code: metadata.target-missing, severity: error, at: {self: true}, message: Expected a field of the containing object}
- kind: value
  id: common.owner-metadata-field-path
  imports: {standard: common.owner-standard-field-path, ordinary: common.owner-ordinary-field-path, root: common.path-root}
  inputs:
    ownerRoot: {type: {use: root}}
    ownerName: {type: {kind: scalar, scalar: text}}
  value:
    kind: choice
    variants:
    - {name: standard, type: {use: standard, bind: {ownerRoot: {input: ownerRoot}, ownerName: {input: ownerName}}}}
    - {name: ordinary, type: {use: ordinary, bind: {ownerRoot: {input: ownerRoot}, ownerName: {input: ownerName}}}}
  representations:
    xml: {kind: choice}
    yaml: {kind: choice}
- kind: value
  id: common.owner-metadata-fields
  namespaces: {xr: http://v8.1c.ru/8.3/xcf/readable}
  imports: {field: common.owner-metadata-field-path, root: common.path-root}
  inputs:
    ownerRoot: {type: {use: root}}
    ownerName: {type: {kind: scalar, scalar: text}}
  value: {kind: sequence, item: {use: field, bind: {ownerRoot: {input: ownerRoot}, ownerName: {input: ownerName}}}}
  representations:
    xml: {kind: element-sequence, path: [xr:Field], item: {kind: with-attributes, attributes: [], content: {kind: text}}}
    yaml: {kind: sequence, item: {kind: scalar, scalar: text}}
  presence:
  - target: self
    xml:
      missing: {denotes: {absent: true}}
      empty: [{form: empty-element, denotes: {absent: true}}]
    yaml:
      missing: {denotes: {absent: true}}
      empty: [{form: empty-sequence, denotes: {absent: true}}]
      omitWhen: {not: {present: {self: true}}}
