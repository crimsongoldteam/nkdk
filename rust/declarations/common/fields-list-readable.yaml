format: nkdk-declarations/1
kind: value
id: common.fields-list-readable
namespaces: {xr: http://v8.1c.ru/8.3/xcf/readable}
value: {kind: sequence, item: {kind: scalar, scalar: text}}
representations:
  xml: {kind: element-sequence, path: [xr:Field], item: {kind: text}}
  yaml: {kind: sequence, item: {kind: scalar, scalar: text}}
presence:
- target: self
  xml:
    missing: {denotes: {absent: true}}
    empty:
    - {form: empty-element, denotes: {absent: true}}
    - {form: empty-item, denotes: {absent: true}}
  yaml:
    missing: {denotes: {absent: true}}
    empty:
    - {form: empty-mapping, denotes: {sequence: []}}
    - {form: empty-sequence, denotes: {absent: true}}
    omitWhen: {not: {present: {self: true}}}
