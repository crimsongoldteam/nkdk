      identifiers: common.type-description-identifiers
      text: common.string
      compatibility: common.boolean
    parameters:
      requireValues:
        type:
          kind: scalar
          scalar: boolean
        default: false
      addTypeDescriptionAttributeToXML:
        type:
          kind: scalar
          scalar: boolean
        default: false
      metadataAttributeTypesOnly:
        type:
          kind: scalar
          scalar: boolean
        default: false
    value:
      kind: record
      fields:
        - name: items
          type:
            use: items
