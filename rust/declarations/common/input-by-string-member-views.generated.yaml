  - format: nkdk-declarations/1
    kind: value
    id: candidate.member-source.primary-type-pattern
    description: Единая смысловая строка описания типа
    imports:
      name: common.string
    value:
      kind: record
      fields:
        - name: value
          type:
            use: name
        - name: first
          type:
            use: name
        - name: second
          type:
            use: name
    representations:
      xml:
        kind: text-pattern
        parts:
          - field: value
          - literal: '|'
          - field: first
          - literal: '|'
          - field: second
      yaml:
        kind: text-pattern
        parts:
          - field: value
          - optional: first
            parts:
              - literal: (
              - field: first
              - optional: second
                parts:
                  - literal: ', '
                  - field: second
              - literal: )
    presence:
      - target:
          field: first
        yaml:
          missing:
            denotes:
              literal: ''
          omitWhen:
            eq:
              - field: first
              - literal: ''
      - target:
          field: second
        yaml:
          missing:
            denotes:
              literal: ''
          omitWhen:
            eq:
              - field: second
              - literal: ''
    constraints:
      - id: valid-qualifiers
        appliesTo:
          - xml-import
          - yaml-validation
        assert:
          and:
            - if:
                matches:
                  value:
                    field: value
                  pattern: Строка|ФиксированнаяСтрока
              then:
                and:
                  - matches:
                      value:
                        field: first
                      pattern: '[0-9]*'
                  - eq:
                      - field: second
                      - literal: ''
              else:
                literal: true
            - if:
                matches:
                  value:
                    field: value
                  pattern: Число|ПоложительноеЧисло
              then:
                and:
                  - matches:
                      value:
                        field: first
                      pattern: '[0-9]*'
                  - matches:
                      value:
                        field: second
                      pattern: '[0-9]*'
              else:
                literal: true
        diagnostic:
          code: type-description.qualifiers
          severity: error
          at:
            self: true
          message: Параметры строки и числа должны быть целыми неотрицательными числами
      - id: metadata-attribute-allowed-types
        appliesTo:
          - xml-import
          - yaml-validation
        assert:
          or:
            - and:
                - eq:
                    - field: value
                    - literal: Строка
                - eq:
                    - field: second
                    - literal: ''
                - or:
                    - eq:
                        - field: first
                        - literal: ''
                    - matches:
                        value:
                          field: first
                        pattern: '[1-9][0-9]*'
            - and:
                - eq:
                    - field: value
                    - literal: ФиксированнаяСтрока
                - matches:
                    value:
                      field: first
                    pattern: '[1-9][0-9]*'
                - eq:
                    - field: second
                    - literal: ''
            - and:
                - matches:
                    value:
                      field: value
                    pattern: Число|ПоложительноеЧисло
                - or:
                    - and:
                        - eq:
                            - field: first
                            - literal: ''
                        - eq:
                            - field: second
                            - literal: ''
                    - and:
                        - matches:
                            value:
                              field: first
                            pattern: '[1-9][0-9]*'
                        - matches:
                            value:
                              field: second
                            pattern: '[0-9]*'
            - matches:
                value:
                  field: value
                pattern: ^(?:Дата)$
            - matches:
                value:
                  field: value
                pattern: ^(?:Время)$
            - matches:
                value:
                  field: value
                pattern: ^(?:ДатаВремя)$
            - matches:
                value:
                  field: value
                pattern: ^(?:Булево)$
            - matches:
                value:
                  field: value
                pattern: ^(?:ХранилищеЗначения)$
            - matches:
                value:
                  field: value
                pattern: ^(?:УникальныйИдентификатор)$
            - matches:
