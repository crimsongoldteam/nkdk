format: nkdk-declarations/1
kind: value
id: common.dcs-settings-parameter-value-collection
namespaces:
  dcscor: http://v8.1c.ru/8.1/data-composition-system/core
imports: {item: common.dcs-parameter-value}
parameters:
  settingsXsi: {type: {kind: scalar, scalar: boolean}, default: true}
inputs:
  profiles: {type: {kind: index, key: {kind: scalar, scalar: text}, value: {kind: scalar, scalar: text}}}
  defaultProfile: {type: {kind: scalar, scalar: text}}
  styleTypes: {type: {kind: index, key: {kind: scalar, scalar: text}, value: {kind: scalar, scalar: text}}}
  defaultLanguage: {type: {kind: scalar, scalar: text}}
  registeredLanguages: {type: {kind: sequence, item: {kind: scalar, scalar: text}}}
  labels: {type: {kind: index, key: {kind: record, fields: [{name: name, type: {kind: scalar, scalar: text}}, {name: code, type: {kind: scalar, scalar: text}}]}, value: {kind: scalar, scalar: text}}}
  codes: {type: {kind: index, key: {kind: record, fields: [{name: name, type: {kind: scalar, scalar: text}}, {name: label, type: {kind: scalar, scalar: text}}]}, value: {kind: scalar, scalar: text}}}
value:
  kind: sequence
  item:
    use: item
    with: {settingsXsi: {parameter: settingsXsi}}
    bind:
      styleTypes: {input: styleTypes}
      defaultLanguage: {input: defaultLanguage}
      registeredLanguages: {input: registeredLanguages}
      labels: {input: labels}
      codes: {input: codes}
representations:
  xml: {kind: element-sequence, path: [dcscor:item]}
  yaml:
    kind: record-mapping
    key: parameter
    itemInputs:
      parameterName: {rowKey: true}
      valueProfile:
        lookup:
          in: {input: profiles}
          key: {rowKey: true}
          default: {input: defaultProfile}
