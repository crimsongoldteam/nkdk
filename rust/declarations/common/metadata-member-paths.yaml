format: nkdk-declarations/1
kind: catalog
declarations:
- kind: value
  id: common.metadata-member-path
  imports: {root: common.path-root, name: common.metadata-name, member: common.path-member-kind}
  value:
    kind: record
    fields:
    - {name: root, type: {use: root}}
    - {name: owner, type: {use: name}}
    - {name: kind, type: {use: member}}
    - {name: name, type: {use: name}}
  representations:
    xml: {kind: text-pattern, parts: [{field: root}, {literal: '.'}, {field: owner}, {literal: '.'}, {field: kind}, {literal: '.'}, {field: name}]}
    yaml: {kind: text-pattern, parts: [{field: root}, {literal: '.'}, {field: owner}, {literal: '.'}, {field: kind}, {literal: '.'}, {field: name}]}
  constraints:
  - id: ordinary-member
    appliesTo: [xml-import, yaml-validation]
    assert: {not: {eq: [{get: {of: {self: true}, field: kind}}, {literal: StandardAttribute}]}}
    diagnostic: {code: path.member-kind, severity: error, at: {self: true}, message: Standard attributes require their own name vocabulary}
- kind: value
  id: common.metadata-standard-attribute-path
  imports: {root: common.path-root, name: common.metadata-name, attribute: common.standard-attribute-name}
  value:
    kind: record
    fields:
    - {name: root, type: {use: root}}
    - {name: owner, type: {use: name}}
    - {name: attribute, type: {use: attribute}}
  representations:
    xml: {kind: text-pattern, parts: [{field: root}, {literal: '.'}, {field: owner}, {literal: '.StandardAttribute.'}, {field: attribute}]}
    yaml: {kind: text-pattern, parts: [{field: root}, {literal: '.'}, {field: owner}, {literal: '.СтандартныйРеквизит.'}, {field: attribute}]}
- kind: value
  id: common.metadata-enum-value-path
  imports: {name: common.metadata-name}
  value:
    kind: record
    fields:
    - {name: owner, type: {use: name}}
    - {name: name, type: {use: name}}
  representations:
    xml: {kind: text-pattern, parts: [{literal: 'Enum.'}, {field: owner}, {literal: '.EnumValue.'}, {field: name}]}
    yaml: {kind: text-pattern, parts: [{literal: 'Перечисление.'}, {field: owner}, {literal: '.'}, {field: name}]}
- kind: value
  id: common.metadata-object-path
  imports: {root: common.path-root, name: common.metadata-name, member: common.path-object-kind}
  value:
    kind: record
    fields:
    - {name: root, type: {use: root}}
    - {name: owner, type: {use: name}}
    - {name: kind, type: {use: member}}
    - {name: name, type: {use: name}}
  representations:
    xml: {kind: text-pattern, parts: [{field: root}, {literal: '.'}, {field: owner}, {literal: '.'}, {field: kind}, {literal: '.'}, {field: name}]}
    yaml: {kind: text-pattern, parts: [{field: root}, {literal: '.'}, {field: owner}, {literal: '.'}, {field: kind}, {literal: '.'}, {field: name}]}
