            scalar: text
    value:
      kind: record
      fields:
        - name: value
          type:
            use: semantic
        - name: state
          type:
            use: boolean
    representations:
      xml:
        kind: record
        fields:
          - field: value
            path: []
      yaml:
        kind: projection
        field: value
    presence:
      - target:
          field: value
        yaml:
          empty:
            - form: 'null'
              denotes:
                input: implicit
          nullWhen:
            eq:
              - field: value
              - input: implicit
      - target:
          field: state
        xml:
          missing:
            denotes:
              and:
                - present:
                    lookup:
                      in:
                        input: states
                      key:
                        record:
                          owner:
                            input: owner
                          property:
                            input: property
                          mode:
                            literal: Extended
                - not:
                    present:
                      lookup:
                        in:
                          input: states
                        key:
                          record:
                            owner:
                              input: owner
                            property:
                              input: property
                            mode:
                              literal: Notify
        yaml:
          missing:
            denotes:
              literal: true
    constraints:
      - id: selected-state
        appliesTo:
          - xml-import
          - yaml-validation
        forms:
          - record
          - scalar
        assert:
          field: state
        diagnostic:
          code: state.expected
          severity: error
          at:
            self: true
          message: Expected the selected state
