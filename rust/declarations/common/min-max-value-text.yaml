format: nkdk-declarations/1
kind: value
id: common.min-max-value-text
value: {kind: scalar, scalar: number, profile: decimal}
namespaces:
  xsi: http://www.w3.org/2001/XMLSchema-instance
  xs: http://www.w3.org/2001/XMLSchema
representations:
  xml:
    kind: with-attributes
    attributes:
      - {name: xsi:type, value: {qname: xs:string}}
    content: {kind: text, decimalSeparator: ",", acceptDecimalSeparators: [".", ","]}
  yaml: {kind: scalar, scalar: number}
presence:
  - target: self
    xml:
      missing: {denotes: {absent: true}}
      empty:
        - {form: empty-element, denotes: {absent: true}}
        - {form: nil, denotes: {absent: true}}
    yaml: {missing: {denotes: {absent: true}}}
