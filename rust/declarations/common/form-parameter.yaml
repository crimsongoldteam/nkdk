format: nkdk-declarations/1
kind: value
id: common.form-parameter
imports: {types: common.type-description, boolean: common.boolean}
namespaces: {f: 'http://v8.1c.ru/8.3/xcf/logform'}
value:
  kind: record
  fields:
  - {name: name, type: {kind: scalar, scalar: text}}
  - {name: type, type: {use: types}}
  - {name: keyParameter, type: {use: boolean}}
representations:
  xml:
    kind: record
    fields:
    - {field: name, path: [], attribute: name}
    - {field: type, path: [f:Type]}
    - {field: keyParameter, path: [f:KeyParameter]}
  yaml:
    kind: mapping
    fields:
    - {field: name, key: Имя}
    - {field: type, key: Тип}
    - {field: keyParameter, key: Ключевой}
presence:
- target: {field: type}
  xml:
    missing: {denotes: {absent: true}}
    empty: [{form: empty-element, denotes: {absent: true}}]
    canonical: [{when: {not: {present: {field: type}}}, form: empty-element}, {form: ordinary}]
  yaml: {missing: {denotes: {absent: true}}}
- target: {field: keyParameter}
  xml: {missing: {denotes: {absent: true}}}
  yaml: {missing: {denotes: {absent: true}}}
