format: nkdk-declarations/1
kind: fragment
id: common.fill-value-compatibility
description: Совместимость явного значения заполнения с единственным объявленным типом
inputs:
  typeItems:
    type:
      kind: sequence
      item:
        kind: record
        fields: [{name: value, type: {kind: scalar, scalar: text}}]
  textValue: {type: {kind: scalar, scalar: boolean}}
  numberValue: {type: {kind: scalar, scalar: boolean}}
  booleanValue: {type: {kind: scalar, scalar: boolean}}
  calendarValue: {type: {kind: scalar, scalar: boolean}}
  referenceValue: {type: {kind: scalar, scalar: boolean}}
  textContent: {type: {kind: scalar, scalar: text}}
  stringLength: {type: {kind: scalar, scalar: text}}
  stringAllowedLength: {type: {kind: scalar, scalar: text}}
  calendarContent: {type: {kind: scalar, scalar: text}}
  dateFractions: {type: {kind: scalar, scalar: text}}
  decimalContent: {type: {kind: scalar, scalar: number, profile: decimal}}
  numberDigits: {type: {kind: scalar, scalar: text}}
  numberFractionDigits: {type: {kind: scalar, scalar: text}}
  numberAllowedSign: {type: {kind: scalar, scalar: text}}
value: {kind: record, fields: []}
representations:
  xml: {kind: record, fields: []}
  yaml: {kind: mapping, fields: []}
constraints:
- id: string-value
  appliesTo: [xml-import, yaml-validation]
  when:
    and:
    - {one: {in: {input: typeItems}, as: item, where: {literal: true}}}
    - {exists: {in: {input: typeItems}, as: item, where: {matches: {value: {get: {of: {var: item}, field: value}}, pattern: 'Строка|ФиксированнаяСтрока'}}}}
  assert: {input: textValue}
  diagnostic: {code: fill-value.type-mismatch, severity: warning, at: {self: true}, message: Значение заполнения не соответствует строковому типу}
- id: string-length
  appliesTo: [xml-import, yaml-validation]
  when:
    and:
    - {input: textValue}
    - {one: {in: {input: typeItems}, as: item, where: {literal: true}}}
    - {exists: {in: {input: typeItems}, as: item, where: {matches: {value: {get: {of: {var: item}, field: value}}, pattern: 'Строка|ФиксированнаяСтрока'}}}}
    - {eq: [{input: stringAllowedLength}, {literal: Variable}]}
    - {matches: {value: {input: stringLength}, pattern: '[1-9][0-9]*'}}
  assert: {textLengthAtMost: {value: {input: textContent}, limit: {input: stringLength}}}
  diagnostic: {code: fill-value.string-length, severity: warning, at: {self: true}, message: Значение заполнения превышает длину строкового типа}
- id: fixed-string-length
  appliesTo: [xml-import, yaml-validation]
  when:
    and:
    - {input: textValue}
    - {one: {in: {input: typeItems}, as: item, where: {literal: true}}}
    - {exists: {in: {input: typeItems}, as: item, where: {eq: [{get: {of: {var: item}, field: value}}, {literal: ФиксированнаяСтрока}]}}}
    - {eq: [{input: stringAllowedLength}, {literal: Fixed}]}
    - {matches: {value: {input: stringLength}, pattern: '[1-9][0-9]*'}}
  assert: {textLengthEquals: {value: {input: textContent}, limit: {input: stringLength}}}
  diagnostic: {code: fill-value.string-length, severity: warning, at: {self: true}, message: Значение заполнения имеет неверную фиксированную длину}
- id: calendar-fraction
  appliesTo: [xml-import, yaml-validation]
  when:
    and:
    - {input: calendarValue}
    - {one: {in: {input: typeItems}, as: item, where: {literal: true}}}
    - {exists: {in: {input: typeItems}, as: item, where: {matches: {value: {get: {of: {var: item}, field: value}}, pattern: 'Дата|Время|ДатаВремя'}}}}
  assert: {calendarFits: {value: {input: calendarContent}, fraction: {input: dateFractions}}}
  diagnostic: {code: fill-value.calendar-fraction, severity: warning, at: {self: true}, message: Значение заполнения не соответствует календарному типу}
- id: number-qualifiers
  appliesTo: [xml-import, yaml-validation]
  when:
    and:
    - {input: numberValue}
    - {one: {in: {input: typeItems}, as: item, where: {literal: true}}}
    - {exists: {in: {input: typeItems}, as: item, where: {matches: {value: {get: {of: {var: item}, field: value}}, pattern: 'Число|ПоложительноеЧисло'}}}}
    - {matches: {value: {input: numberDigits}, pattern: '[1-9][0-9]*'}}
    - {matches: {value: {input: numberFractionDigits}, pattern: '[0-9]+'}}
  assert: {decimalFits: {value: {input: decimalContent}, digits: {input: numberDigits}, fraction: {input: numberFractionDigits}, sign: {input: numberAllowedSign}}}
  diagnostic: {code: fill-value.number-qualifiers, severity: warning, at: {self: true}, message: Значение заполнения не соответствует числовому типу}
- id: unbounded-number-sign
  appliesTo: [xml-import, yaml-validation]
  when:
    and:
    - {input: numberValue}
    - {one: {in: {input: typeItems}, as: item, where: {literal: true}}}
    - {exists: {in: {input: typeItems}, as: item, where: {eq: [{get: {of: {var: item}, field: value}}, {literal: ПоложительноеЧисло}]}}}
    - {eq: [{input: numberDigits}, {literal: '0'}]}
    - {eq: [{input: numberAllowedSign}, {literal: Nonnegative}]}
  assert: {decimalFits: {value: {input: decimalContent}, digits: {literal: '0'}, fraction: {literal: '0'}, sign: {input: numberAllowedSign}}}
  diagnostic: {code: fill-value.number-qualifiers, severity: warning, at: {self: true}, message: Отрицательное значение заполнения не соответствует числовому типу}
- id: number-value
  appliesTo: [xml-import, yaml-validation]
  when:
    and:
    - {one: {in: {input: typeItems}, as: item, where: {literal: true}}}
    - {exists: {in: {input: typeItems}, as: item, where: {matches: {value: {get: {of: {var: item}, field: value}}, pattern: 'Число|ПоложительноеЧисло'}}}}
  assert: {input: numberValue}
  diagnostic: {code: fill-value.type-mismatch, severity: warning, at: {self: true}, message: Значение заполнения не соответствует числовому типу}
- id: boolean-value
  appliesTo: [xml-import, yaml-validation]
  when:
    and:
    - {one: {in: {input: typeItems}, as: item, where: {literal: true}}}
    - {exists: {in: {input: typeItems}, as: item, where: {eq: [{get: {of: {var: item}, field: value}}, {literal: Булево}]}}}
  assert: {input: booleanValue}
  diagnostic: {code: fill-value.type-mismatch, severity: warning, at: {self: true}, message: Значение заполнения не соответствует булевому типу}
- id: calendar-value
  appliesTo: [xml-import, yaml-validation]
  when:
    and:
    - {one: {in: {input: typeItems}, as: item, where: {literal: true}}}
    - {exists: {in: {input: typeItems}, as: item, where: {matches: {value: {get: {of: {var: item}, field: value}}, pattern: 'Дата|Время|ДатаВремя'}}}}
  assert: {input: calendarValue}
  diagnostic: {code: fill-value.type-mismatch, severity: warning, at: {self: true}, message: Значение заполнения не соответствует календарному типу}
- id: reference-value
  appliesTo: [xml-import, yaml-validation]
  when:
    and:
    - {one: {in: {input: typeItems}, as: item, where: {literal: true}}}
    - {exists: {in: {input: typeItems}, as: item, where: {matches: {value: {get: {of: {var: item}, field: value}}, pattern: '(Справочник|Документ|Перечисление|ПланОбмена|ПланСчетов|ПланВидовХарактеристик|ПланВидовРасчета|БизнесПроцесс|Задача)(\..+)?'}}}}
  assert: {input: referenceValue}
  diagnostic: {code: fill-value.type-mismatch, severity: warning, at: {self: true}, message: Значение заполнения не соответствует ссылочному типу}
