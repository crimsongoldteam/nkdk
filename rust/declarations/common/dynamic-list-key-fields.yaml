format: nkdk-declarations/1
kind: value
id: common.dynamic-list-key-fields
value: {kind: sequence, item: {kind: scalar, scalar: text}}
representations:
  xml: {kind: element-sequence, path: [], item: {kind: text}}
  yaml: {kind: sequence, singleton: scalar, item: {kind: scalar, scalar: text}}
presence:
- target: self
  xml: {missing: {denotes: {sequence: []}}}
  yaml:
    missing: {denotes: {sequence: []}}
    omitWhen: {not: {exists: {in: {self: true}, as: item, where: {literal: true}}}}
