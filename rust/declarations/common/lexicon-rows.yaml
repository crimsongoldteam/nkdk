format: nkdk-declarations/1
kind: catalog
declarations:
  - kind: value
    id: common.lexicon-row
    imports: {boolean: common.boolean}
    value:
      kind: record
      fields:
        - {name: name, type: {kind: scalar, scalar: text}}
        - {name: code, type: {kind: scalar, scalar: text}}
        - {name: label, type: {kind: scalar, scalar: text}}
        - {name: canonical, type: {use: boolean}}
    representations:
      xml:
        kind: record
        fields:
          - {field: name, path: [Name]}
          - {field: code, path: [Code]}
          - {field: label, path: [Label]}
          - {field: canonical, path: [Canonical]}
      yaml:
        kind: mapping
        fields:
          - {field: name, key: Имя}
          - {field: code, key: Код}
          - {field: label, key: Представление}
          - {field: canonical, key: Основное}
  - kind: value
    id: common.lexicon-rows
    imports: {row: common.lexicon-row}
    value: {kind: sequence, item: {use: row}}
    representations:
      xml: {kind: element-sequence, path: [Lexeme], item: {kind: declared}}
      yaml: {kind: sequence, item: {kind: declared}}
