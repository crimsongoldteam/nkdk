format: nkdk-declarations/1
kind: catalog
declarations:
- kind: value
  id: common.choice-parameter
  namespaces:
    app: http://v8.1c.ru/8.2/managed-application/core
  imports: {value: common.metadata-value}
  value:
    kind: record
    fields:
    - {name: name, type: {kind: scalar, scalar: text}}
    - {name: value, type: {use: value}}
  representations:
    xml:
      kind: record
      fields:
      - {field: name, path: [], attribute: name}
      - {field: value, path: [app:value]}
    yaml:
      kind: mapping
      fields:
      - {field: name, key: Имя}
      - {field: value, key: Значение}
  presence:
  - target: {field: value}
    xml:
      missing: {denotes: {absent: true}}
      empty:
      - {form: empty-element, denotes: {absent: true}}
      - {form: nil, denotes: {absent: true}}
      canonical:
      - {when: {not: {present: {field: value}}}, form: nil}
    yaml: {missing: {denotes: {absent: true}}}
- kind: value
  id: common.choice-parameters
  namespaces:
    app: http://v8.1c.ru/8.2/managed-application/core
  imports: {item: common.choice-parameter}
  value: {kind: sequence, item: {use: item}}
  representations:
    xml: {kind: element-sequence, path: [app:item]}
    yaml: {kind: record-mapping, key: name, value: value}
