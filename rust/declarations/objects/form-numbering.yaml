# Источники номеров и резервов формы; полное преобразование описано отдельно.
format: nkdk-declarations/1
kind: catalog
declarations:
  - format: nkdk-declarations/1
    kind: object
    id: metadata.form-attribute-numbering
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    inputs:
      component:
        type: {kind: scalar, scalar: text}
      owner:
        type: {kind: scalar, scalar: text}
    value:
      kind: record
      fields:
        - {name: name, type: {kind: scalar, scalar: text}}
        - {name: id, type: {kind: scalar, scalar: text}}
    representations:
      xml:
        kind: record
        fields: [{field: name, path: [f:Attribute], attribute: name}, {field: id, path: [f:Attribute], attribute: id}]
      yaml:
        kind: mapping
        fields: [{field: name, key: Имя}, {field: id, key: Идентификатор}]
    presence:
      - target: {field: id}
        xml: {missing: {denotes: {absent: true}}}
        yaml: {missing: {denotes: {absent: true}}}
    contributions:
      - index: metadata.form-attribute-identities
        key: {record: {component: {input: component}, owner: {input: owner}, name: {field: name}}}
        value: {field: id}
        when: {present: {field: id}}
      - index: metadata.form-attribute-identities
        key: {record: {component: {input: component}, owner: {input: owner}, name: {field: name}}}
        allocate: {scope: [component, owner], first: 1}
