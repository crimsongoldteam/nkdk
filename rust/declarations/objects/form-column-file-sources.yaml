          - {name: origin, type: {kind: scalar, scalar: text}}
          - {name: owner, type: {kind: scalar, scalar: text}}
        value: {kind: scalar, scalar: text}
    current:
      type:
        kind: index
        key:
          kind: record
          fields:
          - {name: component, type: {kind: scalar, scalar: text}}
          - {name: name, type: {kind: scalar, scalar: text}}
          - {name: owner, type: {kind: scalar, scalar: text}}
        value: {kind: scalar, scalar: text}
  value:
    kind: record
    fields:
    - {name: name, type: {kind: scalar, scalar: text}}
    - name: columns
      type:
        use: columns
        bind:
          component: {input: component}
          owner: {input: owner}
          parent:
            if:
              eq:
              - require:
                  lookup:
                    in: {input: modes}
                    key:
                      record:
                        component: {input: component}
                        owner: {input: owner}
                        origin: {input: origin}
                        name: {field: name}
              - {literal: named}
            then:
              logicalAddress:
                parts:
                - {literal: Атрибут}
                - {field: name}
            else:
              logicalAddress:
                parts:
                - {literal: Атрибут}
                - {collectionPosition: true}
          current: {input: current}
  representations:
    xml:
      kind: record
      fields:
      - {field: name, path: [], attribute: name}
      - {field: columns, path: ['f:Columns']}
    yaml:
      kind: mapping
      fields:
      - {field: name, key: Имя}
      - {field: columns, key: Колонки}
  presence:
  - target: {field: columns}
    xml:
      missing:
        denotes: {absent: true}
    yaml:
      missing:
        denotes: {absent: true}
- kind: value
  id: source.form-base-column-parent-rows
  namespaces: {f: 'http://v8.1c.ru/8.3/xcf/logform'}
  imports: {row: source.form-base-column-parent-row}
  inputs:
    component: {type: {kind: scalar, scalar: text}}
