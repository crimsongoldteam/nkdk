    owner: {type: {kind: scalar, scalar: text}}
    modes: {index: metadata.form-attribute-address-modes}
    current: {index: metadata.current-form-column-candidates}
  value:
    kind: record
    fields:
    - {name: rows, type: {use: rows, bind: {component: {input: component}, owner: {input: owner}, origin: {literal: base}, modes: {input: modes},
          current: {input: current}}}}
  representations:
    xml:
      kind: record
      fields:
      - {field: rows, path: ['f:Form', 'f:BaseForm', 'f:Attributes']}
    yaml:
      kind: mapping
      fields:
      - {field: rows, key: Реквизиты}
  presence:
  - target: {field: rows}
    xml:
      missing:
        denotes: {absent: true}
    yaml:
      missing:
        denotes: {absent: true}
