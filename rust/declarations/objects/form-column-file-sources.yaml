  value:
    kind: sequence
    item: {use: row, bind: {component: {input: component}, owner: {input: owner}, origin: {input: origin}, modes: {input: modes}, current: {input: current}}}
  representations:
    xml:
      kind: element-sequence
      path:
      - f:Attribute
