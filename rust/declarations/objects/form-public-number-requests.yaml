# Адрес реквизита определяется подготовленным индексом живых имён.
format: nkdk-declarations/1
kind: catalog
declarations:
  - format: nkdk-declarations/1
    kind: fragment
    id: source.public-form-attribute-number-request
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      address:
        type:
          kind: scalar
          scalar: text
    value:
      kind: record
      fields: []
    representations:
      xml:
        kind: record
        fields: []
      yaml:
        kind: mapping
        fields: []
    contributions:
      - index: metadata.form-attribute-identities
        key:
          record: {component: {input: component}, owner: {input: owner}, name: {input: address}}
        allocate:
          scope: [component, owner]
          first: 1
  - format: nkdk-declarations/1
    kind: value
    id: source.public-form-number-request-row
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      groupModes:
        type:
          kind: index
          key: {kind: record, fields: [{name: component, type: {kind: scalar, scalar: text}}, {name: name, type: {kind: scalar, scalar: text}}, {name: origin, type: {kind: scalar, scalar: text}}, {name: owner, type: {kind: scalar, scalar: text}}, {name: parent, type: {kind: scalar, scalar: text}}]}
          value: {kind: scalar, scalar: text}
      attributeModes:
        type:
          kind: index
          key: {kind: record, fields: [{name: component, type: {kind: scalar, scalar: text}}, {name: name, type: {kind: scalar, scalar: text}}, {name: origin, type: {kind: scalar, scalar: text}}, {name: owner, type: {kind: scalar, scalar: text}}]}
          value: {kind: scalar, scalar: text}
    imports:
      ordinary: source.public-form-column-requests
      additional: source.public-form-additional-column-requests
      columns: source.public-form-ordinary-column-requests
      identity: source.public-form-attribute-number-request
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    value:
      kind: record
      fields:
        - name: name
          type: {kind: scalar, scalar: text}
        - name: additional
          type: {use: additional, bind: {component: {input: component}, owner: {input: owner}, parent: {if: {eq: [{require: {lookup: {in: {input: attributeModes}, key: {record: {component: {input: component}, name: {field: name}, origin: {literal: current}, owner: {input: owner}}}}}}, {literal: positional}]}, then: {logicalAddress: {parts: [{literal: Атрибут}, {collectionPosition: true}]}}, else: {logicalAddress: {parts: [{literal: Атрибут}, {field: name}]}}}, groupModes: {input: groupModes}}}
    representations:
      xml:
        kind: record
        fields:
          - {field: name, path: [], attribute: name}
          - {field: additional, path: [f:Columns]}
      yaml:
        kind: mapping
        fields:
          - {field: name, key: Имя}
          - {field: additional, key: ДополнительныеКолонки}
    presence:
      - target:
          field: additional
        xml:
          missing: {denotes: {absent: true}}
        yaml:
          missing: {denotes: {absent: true}}
    compose:
      - use: identity
        bind:
          component: {input: component}
          owner: {input: owner}
          address: {if: {eq: [{require: {lookup: {in: {input: attributeModes}, key: {record: {component: {input: component}, name: {field: name}, origin: {literal: current}, owner: {input: owner}}}}}}, {literal: positional}]}, then: {logicalAddress: {parts: [{literal: Атрибут}, {collectionPosition: true}]}}, else: {logicalAddress: {parts: [{literal: Атрибут}, {field: name}]}}}
      - use: columns
        bind:
          component: {input: component}
          owner: {input: owner}
          parent: {if: {eq: [{require: {lookup: {in: {input: attributeModes}, key: {record: {component: {input: component}, name: {field: name}, origin: {literal: current}, owner: {input: owner}}}}}}, {literal: positional}]}, then: {logicalAddress: {parts: [{literal: Атрибут}, {collectionPosition: true}]}}, else: {logicalAddress: {parts: [{literal: Атрибут}, {field: name}]}}}
  - format: nkdk-declarations/1
    kind: value
    id: source.public-form-number-request-rows
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      groupModes:
        type:
          kind: index
          key: {kind: record, fields: [{name: component, type: {kind: scalar, scalar: text}}, {name: name, type: {kind: scalar, scalar: text}}, {name: origin, type: {kind: scalar, scalar: text}}, {name: owner, type: {kind: scalar, scalar: text}}, {name: parent, type: {kind: scalar, scalar: text}}]}
          value: {kind: scalar, scalar: text}
      attributeModes:
        type:
          kind: index
          key: {kind: record, fields: [{name: component, type: {kind: scalar, scalar: text}}, {name: name, type: {kind: scalar, scalar: text}}, {name: origin, type: {kind: scalar, scalar: text}}, {name: owner, type: {kind: scalar, scalar: text}}]}
          value: {kind: scalar, scalar: text}
    imports:
      row: source.public-form-number-request-row
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    value:
      kind: sequence
      item:
        use: row
        bind:
          component: {input: component}
          owner: {input: owner}
          groupModes: {input: groupModes}
          attributeModes: {input: attributeModes}
    representations:
      xml:
        kind: element-sequence
        path:
          - f:Attribute
      yaml:
        kind: record-mapping
        key: name
  - format: nkdk-declarations/1
    kind: object
    id: metadata.public-form-number-requests
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      groupModes:
        index: metadata.form-additional-group-address-modes
      attributeModes:
        index: metadata.form-attribute-address-modes
    imports:
      rows: source.public-form-number-request-rows
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    value:
      kind: record
      fields:
        - name: rows
          type: {use: rows, bind: {component: {input: component}, owner: {input: owner}, groupModes: {input: groupModes}, attributeModes: {input: attributeModes}}}
    representations:
      xml:
        kind: record
        fields:
          - {field: rows, path: [f:Form, f:Attributes]}
      yaml:
        kind: mapping
        fields:
          - {field: rows, key: Реквизиты}
    presence:
      - target:
          field: rows
        xml:
          missing: {denotes: {absent: true}}
        yaml:
          missing: {denotes: {absent: true}}
