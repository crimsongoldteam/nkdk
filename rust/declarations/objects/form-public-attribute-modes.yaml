# Режим адресации по живым именам; повторы и пустые имена используют позицию.
format: nkdk-declarations/1
kind: catalog
declarations:
  - kind: value
    id: source.public-form-attribute-name
    value:
      kind: record
      fields:
        - name: name
          type: {kind: scalar, scalar: text}
    representations:
      xml:
        kind: record
        fields:
          - {field: name, path: [], attribute: name}
      yaml:
        kind: mapping
        fields:
          - {field: name, key: Имя}
  - kind: value
    id: source.public-form-attribute-names
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    imports:
      row: source.public-form-attribute-name
    value:
      kind: sequence
      item:
        use: row
    representations:
      xml:
        kind: element-sequence
        path:
          - f:Attribute
        item:
          kind: declared
      yaml:
        kind: record-mapping
        key: name
  - kind: object
    id: metadata.public-form-attribute-modes
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    imports:
      rows: source.public-form-attribute-names
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
    value:
      kind: record
      fields:
        - name: rows
          type: {use: rows}
    representations:
      xml:
        kind: record
        fields:
          - {field: rows, path: [f:Form, f:Attributes]}
      yaml:
        kind: mapping
        fields:
          - {field: rows, key: Реквизиты}
    presence:
      - target:
          field: rows
        xml:
          missing: {denotes: {absent: true}}
        yaml:
          missing: {denotes: {absent: true}}
    contributions:
      - index: metadata.form-attribute-address-modes
        duplicates: coalesce-equal
        forEach:
          in: {field: rows}
          as: row
        key:
          record: {component: {input: component}, owner: {input: owner}, origin: {literal: current}, name: {get: {of: {var: row}, field: name}}}
        value:
          if: {and: [{not: {eq: [{get: {of: {var: row}, field: name}}, {literal: ''}]}}, {one: {in: {field: rows}, as: candidate, where: {eq: [{get: {of: {var: candidate}, field: name}}, {get: {of: {var: row}, field: name}}]}}}]}
          then: {literal: named}
          else: {literal: positional}
