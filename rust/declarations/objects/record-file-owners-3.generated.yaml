                  - not:
                      present:
                        field: synonym
              form: empty-element
        yaml:
          missing:
            denotes:
              if:
                input: adopted
              then:
                absent: true
              else:
                if:
                  input: adopted
                then:
                  absent: true
                else:
                  match:
                    value:
                      transform:
                        local: name-words
                        value:
                          input: ownerName
                    present:
                      as: words
                      then:
                        sequence:
                          - record:
                              language:
                                input: defaultLanguage
                              content:
                                var: words
                    absent:
                      absent: true
