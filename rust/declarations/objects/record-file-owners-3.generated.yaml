                              - literal: Version8_3_26
                          - eq:
                              - input: compatibilityMode
                              - literal: Version8_3_27
                          - eq:
                              - input: compatibilityMode
                              - literal: DontUse
                      else:
                        literal: false
                then:
                  sequence:
                    - record:
                        name:
                          literal: Category
                        mode:
                          literal: Notify
                else:
                  sequence: []
              - if:
                  present:
                    field: notice
                then:
                  sequence:
                    - record:
                        name:
                          literal: ExtendedConfigurationObject
                        mode:
                          field: notice
                else:
                  sequence: []
      - target:
          field: category
        xml:
          missing:
            denotes:
              absent: true
        yaml:
          default:
            if:
              input: adopted
            then:
              absent: true
            else:
              variant:
                name: plain
                value:
