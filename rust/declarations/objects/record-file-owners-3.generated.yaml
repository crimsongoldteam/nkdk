# Generated complete file declarations from rules.ts
format: nkdk-declarations/1
kind: catalog
declarations:
  - format: nkdk-declarations/1
    kind: fragment
    id: metadata.command-group.base-state
    imports:
      stateRows: common.property-states
      compatibility: system.CompatibilityMode
      context_category: >-
        metadata.command-group.history.scalars.category.common.stateful.system.CommandGroupCategory
      state: common.base-reference-state
    namespaces:
      md: http://v8.1c.ru/8.3/MDClasses
    inputs:
      adopted:
        type:
          kind: scalar
          scalar: boolean
      owner:
        type:
          kind: scalar
          scalar: text
      states:
        type:
          kind: index
          key:
            kind: record
            fields:
              - name: owner
                type:
                  kind: scalar
                  scalar: text
              - name: property
                type:
                  kind: scalar
                  scalar: text
              - name: mode
                type:
                  kind: scalar
                  scalar: text
          value:
            kind: scalar
            scalar: text
      compatibilityMode:
        type:
          use: compatibility
      component:
        type:
          kind: scalar
          scalar: text
      baseIds:
        type:
          kind: index
          key:
            kind: record
            fields:
              - name: component
                type:
                  kind: scalar
                  scalar: text
              - name: identity
                type:
                  kind: scalar
                  scalar: text
          value:
            kind: scalar
            scalar: text
    value:
      kind: record
      fields:
        - name: history
          type:
            use: stateRows
        - name: category
          type:
            use: context_category
            bind:
              implicit:
                literal: NavigationPanel
              property:
                literal: Category
              owner:
                input: owner
              states:
                input: states
        - name: state
          type:
            use: state
        - name: base
          type:
            kind: scalar
            scalar: text
        - name: notice
          type:
            kind: scalar
            scalar: text
    representations:
      xml:
        kind: record
        fields:
          - field: history
            path:
              - md:MetaDataObject
              - md:CommandGroup
              - md:InternalInfo
          - field: base
            path:
              - md:MetaDataObject
              - md:CommandGroup
              - md:Properties
              - md:ExtendedConfigurationObject
          - field: category
            path:
              - md:MetaDataObject
              - md:CommandGroup
              - md:Properties
              - md:Category
      yaml:
        kind: mapping
        fields:
          - field: history
            key: Состояния
          - field: category
            key: Категория
          - field: state
            key: ОбъектРасширяемойКонфигурации
    presence:
      - target:
          field: history
        xml:
          missing:
            denotes:
              sequence: []
          canonical:
            - when:
                and:
                  - input: adopted
                  - not:
                      exists:
                        in:
                          field: history
                        as: row
                        where:
                          literal: true
              form: empty-element
            - when:
                not:
                  exists:
                    in:
                      field: history
                    as: row
                    where:
                      literal: true
              form: missing
            - form: ordinary
        yaml:
          default:
            concat:
              - if:
                  and:
                    - isVariant:
                        value:
                          field: category
                        variant: changed
                    - if:
                        input: adopted
                      then:
                        literal: false
                      else:
                        literal: false
                then:
                  sequence:
                    - record:
                        name:
                          literal: Category
                        mode:
                          literal: Extended
                else:
                  sequence: []
              - if:
                  and:
                    - isVariant:
                        value:
                          field: category
                        variant: notified
                    - if:
                        input: adopted
                      then:
                        or:
                          - eq:
                              - input: compatibilityMode
                              - literal: Version8_3_15
                          - eq:
                              - input: compatibilityMode
                              - literal: Version8_3_16
                          - eq:
                              - input: compatibilityMode
                              - literal: Version8_3_17
                          - eq:
                              - input: compatibilityMode
                              - literal: Version8_3_18
