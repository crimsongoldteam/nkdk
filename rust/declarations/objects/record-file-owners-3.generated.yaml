          scalar: text
  - format: nkdk-declarations/1
    kind: fragment
    imports:
      value0: common.string
      value1: common.i8n-text
    value:
      kind: record
      fields:
        - name: name
          type:
            use: value0
        - name: synonym
          type:
            use: value1
            with:
              excludeIfEqualNameYAML: true
              preserveEmptyXML: true
            bind:
              defaultLanguage:
                input: defaultLanguage
              registeredLanguages:
                input: registeredLanguages
              ownerName:
                input: ownerName
        - name: comment
