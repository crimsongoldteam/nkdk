          field: name
        xml:
          missing:
            denotes:
              absent: true
        yaml:
          missing:
            denotes:
              input: ownerName
      - target:
          field: synonym
        xml:
          missing:
            denotes:
              absent: true
          canonical:
            - when:
                and:
                  - input: adopted
                  - not:
                      present:
                        field: synonym
              form: missing
            - when:
                and:
                  - not:
                      input: adopted
                  - not:
                      present:
                        field: synonym
              form: empty-element
        yaml:
          missing:
            denotes:
              if:
                input: adopted
              then:
                absent: true
              else:
                if:
                  input: adopted
                then:
                  absent: true
                else:
                  match:
                    value:
                      transform:
                        local: name-words
                        value:
                          input: ownerName
                    present:
                      as: words
                      then:
                        sequence:
                          - record:
                              language:
                                input: defaultLanguage
                              content:
                                var: words
                    absent:
                      absent: true
      - target:
          field: comment
        xml:
          missing:
            denotes:
              absent: true
        yaml:
          default:
            literal: ''
