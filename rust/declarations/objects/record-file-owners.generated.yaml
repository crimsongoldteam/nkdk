    id: metadata.language.ordinary.1
    namespaces:
      md: http://v8.1c.ru/8.3/MDClasses
    types:
      name-words:
        kind: text-transform
        units: utf16
        classes:
          upper:
            - - 65
              - 90
            - - 1040
              - 1071
            - - 1025
              - 1025
          lower:
            - - 97
              - 122
            - - 1072
              - 1103
            - - 1105
              - 1105
          digit:
            - - 48
              - 57
        state:
          abbreviation: true
          hasDigit: false
        transitions:
          - when:
              and:
                - class: upper
                - tokenEmpty: true
            emit: append
            set:
              abbreviation: true
              hasDigit: false
          - when:
              and:
                - class: upper
                - flag: abbreviation
            emit: append
            set: {}
          - when:
              class: upper
            emit: start-token
            set:
              abbreviation: true
              hasDigit: false
          - when:
              class: lower
            emit: append
            set:
              abbreviation: false
          - when:
              and:
                - class: digit
                - not:
                    tokenEmpty: true
                - not:
                    flag: hasDigit
                - or:
                    - nextAfterRun:
                        class: digit
                        is: upper
                    - nextAfterRun:
                        class: digit
                        end: true
            emit: start-token
            set:
              abbreviation: false
              hasDigit: true
          - when:
              class: digit
            emit: append
            set:
              abbreviation: false
              hasDigit: true
          - emit: discard
            set: {}
        result:
          separator: ' '
          first:
            kind: identity
          rest:
            kind: lower-first-unless-all-in-class
            class: upper
          lowercase:
            - from:
                - 65
                - 90
              offset: 32
            - from:
                - 1040
                - 1071
              offset: 32
            - from:
                - 1025
                - 1025
              offset: 80
          emptyInput: empty-text
          noTokens: absent
