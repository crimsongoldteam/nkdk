      kind: sequence
      item: {kind: declared}
- kind: value
  id: source.form-base-column-container
  imports: {ordinary: source.form-base-column-identities, additional: source.form-base-additional-column-groups}
  inputs:
    component: {type: {kind: scalar, scalar: text}}
    owner: {type: {kind: scalar, scalar: text}}
    parent: {type: {kind: scalar, scalar: text}}
    current:
      type:
        kind: index
        key:
          kind: record
          fields:
          - {name: component, type: {kind: scalar, scalar: text}}
          - {name: name, type: {kind: scalar, scalar: text}}
          - {name: owner, type: {kind: scalar, scalar: text}}
        value: {kind: scalar, scalar: text}
  compose:
  - {use: ordinary, bind: {component: {input: component}, owner: {input: owner}, parent: {input: parent}, current: {input: current}}}
  value:
    kind: record
    fields:
    - {name: groups, type: {use: additional, bind: {component: {input: component}, owner: {input: owner}, parent: {input: parent}, current: {
            input: current}}}}
  representations:
    xml:
      kind: record
      fields:
      - {field: groups, path: []}
