    types:
      name-words:
        kind: text-transform
        units: utf16
        classes:
          upper:
            - - 65
              - 90
            - - 1040
              - 1071
            - - 1025
              - 1025
          lower:
            - - 97
              - 122
            - - 1072
              - 1103
            - - 1105
              - 1105
          digit:
            - - 48
              - 57
        state:
          abbreviation: true
          hasDigit: false
        transitions:
          - when:
              and:
                - class: upper
                - tokenEmpty: true
            emit: append
            set:
              abbreviation: true
              hasDigit: false
          - when:
              and:
                - class: upper
                - flag: abbreviation
            emit: append
            set: {}
          - when:
              class: upper
            emit: start-token
            set:
              abbreviation: true
              hasDigit: false
          - when:
              class: lower
            emit: append
            set:
              abbreviation: false
          - when:
              and:
                - class: digit
                - not:
                    tokenEmpty: true
                - not:
                    flag: hasDigit
                - or:
                    - nextAfterRun:
                        class: digit
                        is: upper
                    - nextAfterRun:
                        class: digit
                        end: true
            emit: start-token
            set:
              abbreviation: false
              hasDigit: true
          - when:
              class: digit
            emit: append
            set:
              abbreviation: false
              hasDigit: true
          - emit: discard
            set: {}
        result:
          separator: ' '
          first:
            kind: identity
          rest:
            kind: lower-first-unless-all-in-class
            class: upper
          lowercase:
            - from:
                - 65
                - 90
              offset: 32
            - from:
                - 1040
                - 1071
              offset: 32
            - from:
                - 1025
                - 1025
              offset: 80
          emptyInput: empty-text
          noTokens: absent
    state-relations:
      - field: state
        sources:
          base:
            present:
              if:
                input: adopted
              then:
                require:
                  lookup:
                    in:
                      input: baseIds
                    key:
                      record:
                        component:
                          input: component
                        identity:
                          field: uuid
              else:
                absent: true
          notice:
            equals:
              literal: Notify
            from:
              if:
                present:
                  field: history
              then:
                match:
                  value:
                    select:
                      in:
                        field: history
                      as: item
                      where:
                        and:
                          - present:
                              get:
                                of:
                                  var: item
                                field: name
                          - eq:
                              - get:
                                  of:
                                    var: item
                                  field: name
                              - literal: ExtendedConfigurationObject
                  present:
                    as: selected
                    then:
                      get:
                        of:
                          var: selected
                        field: mode
                  absent:
                    absent: true
              else:
                absent: true
        states:
          default:
            - base
          empty: []
          tagged:
            - base
            - notice
          text:
            - notice
    xmlOrder:
      - history
