# Адрес реквизита определяется подготовленным индексом живых имён.
format: nkdk-declarations/1
kind: catalog
declarations:
  - format: nkdk-declarations/1
    kind: value
    id: source.public-form-column-request
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      parent:
        type:
          kind: scalar
          scalar: text
    value:
      kind: record
      fields:
        - name: name
          type: {kind: scalar, scalar: text}
    representations:
      xml:
        kind: record
        fields:
          - {field: name, path: [], attribute: name}
      yaml:
        kind: mapping
        fields:
          - {field: name, key: Имя}
  - format: nkdk-declarations/1
    kind: value
    id: source.public-form-column-requests
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      parent:
        type:
          kind: scalar
          scalar: text
    imports:
      row: source.public-form-column-request
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    value:
      kind: sequence
      item:
        use: row
        bind:
          component: {input: component}
          owner: {input: owner}
          parent: {input: parent}
    representations:
      xml:
        kind: element-sequence
        path:
          - f:Column
      yaml:
        kind: record-mapping
        key: name
  - format: nkdk-declarations/1
    kind: fragment
    id: source.public-form-ordinary-column-requests
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      parent:
        type:
          kind: scalar
          scalar: text
    imports:
      columns: source.public-form-column-requests
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    value:
      kind: record
      fields:
        - name: ordinary
          type: {use: columns, bind: {component: {input: component}, owner: {input: owner}, parent: {input: parent}}}
    representations:
      xml:
        kind: record
        fields:
          - {field: ordinary, path: [f:Columns]}
      yaml:
        kind: mapping
        fields:
          - {field: ordinary, key: Колонки}
    presence:
      - target:
          field: ordinary
        xml:
          missing: {denotes: {absent: true}}
        yaml:
          missing: {denotes: {absent: true}}
    contributions:
      - index: metadata.form-attribute-identities
        key:
          record: {component: {input: component}, owner: {input: owner}, name: {if: {eq: [{get: {of: {var: row}, field: name}}, {literal: ''}]}, then: {logicalAddress: {parent: {input: parent}, parts: [{literal: Колонка}, {var: position}]}}, else: {logicalAddress: {parent: {input: parent}, parts: [{literal: Колонка}, {get: {of: {var: row}, field: name}}]}}}}
        allocate:
          scope: [component, owner]
          first: 1
        forEach:
          in: {field: ordinary}
          as: row
          index: position
  - format: nkdk-declarations/1
    kind: fragment
    id: source.public-form-group-column-requests
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      parent:
        type:
          kind: scalar
          scalar: text
    imports:
      columns: source.public-form-column-requests
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    value:
      kind: record
      fields:
        - name: columns
          type: {use: columns, bind: {component: {input: component}, owner: {input: owner}, parent: {input: parent}}}
    representations:
      xml:
        kind: record
        fields:
          - {field: columns, path: []}
      yaml:
        kind: mapping
        fields:
          - {field: columns, key: Колонки}
    presence:
      - target:
          field: columns
        xml:
          missing: {denotes: {absent: true}}
        yaml:
          missing: {denotes: {absent: true}}
    contributions:
      - index: metadata.form-attribute-identities
        key:
          record: {component: {input: component}, owner: {input: owner}, name: {if: {eq: [{get: {of: {var: row}, field: name}}, {literal: ''}]}, then: {logicalAddress: {parent: {input: parent}, parts: [{literal: Колонка}, {var: position}]}}, else: {logicalAddress: {parent: {input: parent}, parts: [{literal: Колонка}, {get: {of: {var: row}, field: name}}]}}}}
        allocate:
          scope: [component, owner]
          first: 1
        forEach:
          in: {field: columns}
          as: row
          index: position
  - format: nkdk-declarations/1
    kind: value
    id: source.public-form-additional-column-request
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      parent:
        type:
          kind: scalar
          scalar: text
      groupModes:
        type:
          kind: index
          key: {kind: record, fields: [{name: component, type: {kind: scalar, scalar: text}}, {name: name, type: {kind: scalar, scalar: text}}, {name: origin, type: {kind: scalar, scalar: text}}, {name: owner, type: {kind: scalar, scalar: text}}, {name: parent, type: {kind: scalar, scalar: text}}]}
          value: {kind: scalar, scalar: text}
    imports:
      columns: source.public-form-group-column-requests
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    value:
      kind: record
      fields:
        - name: table
          type: {kind: scalar, scalar: text}
    representations:
      xml:
        kind: record
        fields:
          - {field: table, path: [], attribute: table}
      yaml:
        kind: mapping
        fields:
          - {field: table, key: Таблица}
    compose:
      - use: columns
        bind:
          component: {input: component}
          owner: {input: owner}
          parent: {if: {eq: [{require: {lookup: {in: {input: groupModes}, key: {record: {component: {input: component}, name: {field: table}, origin: {literal: current}, owner: {input: owner}, parent: {input: parent}}}}}}, {literal: positional}]}, then: {logicalAddress: {parent: {input: parent}, parts: [{literal: ДополнительныеКолонки}, {collectionPosition: true}]}}, else: {logicalAddress: {parent: {input: parent}, parts: [{literal: ДополнительныеКолонки}, {field: table}]}}}
  - format: nkdk-declarations/1
    kind: value
    id: source.public-form-additional-column-requests
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      parent:
        type:
          kind: scalar
          scalar: text
      groupModes:
        type:
          kind: index
          key: {kind: record, fields: [{name: component, type: {kind: scalar, scalar: text}}, {name: name, type: {kind: scalar, scalar: text}}, {name: origin, type: {kind: scalar, scalar: text}}, {name: owner, type: {kind: scalar, scalar: text}}, {name: parent, type: {kind: scalar, scalar: text}}]}
          value: {kind: scalar, scalar: text}
    imports:
      row: source.public-form-additional-column-request
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    value:
      kind: sequence
      item:
        use: row
        bind:
          component: {input: component}
          owner: {input: owner}
          parent: {input: parent}
          groupModes: {input: groupModes}
    representations:
      xml:
        kind: element-sequence
        path:
          - f:AdditionalColumns
      yaml:
        kind: record-mapping
        key: table
        value: columns
  - format: nkdk-declarations/1
    kind: value
    id: source.public-form-attribute-column-requests
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      groupModes:
        type:
          kind: index
          key: {kind: record, fields: [{name: component, type: {kind: scalar, scalar: text}}, {name: name, type: {kind: scalar, scalar: text}}, {name: origin, type: {kind: scalar, scalar: text}}, {name: owner, type: {kind: scalar, scalar: text}}, {name: parent, type: {kind: scalar, scalar: text}}]}
          value: {kind: scalar, scalar: text}
      attributeModes:
        type:
          kind: index
          key: {kind: record, fields: [{name: component, type: {kind: scalar, scalar: text}}, {name: name, type: {kind: scalar, scalar: text}}, {name: origin, type: {kind: scalar, scalar: text}}, {name: owner, type: {kind: scalar, scalar: text}}]}
          value: {kind: scalar, scalar: text}
    imports:
      ordinary: source.public-form-column-requests
      additional: source.public-form-additional-column-requests
      columns: source.public-form-ordinary-column-requests
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    value:
      kind: record
      fields:
        - name: name
          type: {kind: scalar, scalar: text}
        - name: additional
          type: {use: additional, bind: {component: {input: component}, owner: {input: owner}, parent: {if: {eq: [{require: {lookup: {in: {input: attributeModes}, key: {record: {component: {input: component}, name: {field: name}, origin: {literal: current}, owner: {input: owner}}}}}}, {literal: positional}]}, then: {logicalAddress: {parts: [{literal: Атрибут}, {collectionPosition: true}]}}, else: {logicalAddress: {parts: [{literal: Атрибут}, {field: name}]}}}, groupModes: {input: groupModes}}}
    representations:
      xml:
        kind: record
        fields:
          - {field: name, path: [], attribute: name}
          - {field: additional, path: [f:Columns]}
      yaml:
        kind: mapping
        fields:
          - {field: name, key: Имя}
          - {field: additional, key: ДополнительныеКолонки}
    presence:
      - target:
          field: additional
        xml:
          missing: {denotes: {absent: true}}
        yaml:
          missing: {denotes: {absent: true}}
    compose:
      - use: columns
        bind:
          component: {input: component}
          owner: {input: owner}
          parent: {if: {eq: [{require: {lookup: {in: {input: attributeModes}, key: {record: {component: {input: component}, name: {field: name}, origin: {literal: current}, owner: {input: owner}}}}}}, {literal: positional}]}, then: {logicalAddress: {parts: [{literal: Атрибут}, {collectionPosition: true}]}}, else: {logicalAddress: {parts: [{literal: Атрибут}, {field: name}]}}}
  - format: nkdk-declarations/1
    kind: value
    id: source.public-form-attribute-column-request-rows
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      groupModes:
        type:
          kind: index
          key: {kind: record, fields: [{name: component, type: {kind: scalar, scalar: text}}, {name: name, type: {kind: scalar, scalar: text}}, {name: origin, type: {kind: scalar, scalar: text}}, {name: owner, type: {kind: scalar, scalar: text}}, {name: parent, type: {kind: scalar, scalar: text}}]}
          value: {kind: scalar, scalar: text}
      attributeModes:
        type:
          kind: index
          key: {kind: record, fields: [{name: component, type: {kind: scalar, scalar: text}}, {name: name, type: {kind: scalar, scalar: text}}, {name: origin, type: {kind: scalar, scalar: text}}, {name: owner, type: {kind: scalar, scalar: text}}]}
          value: {kind: scalar, scalar: text}
    imports:
      row: source.public-form-attribute-column-requests
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    value:
      kind: sequence
      item:
        use: row
        bind:
          component: {input: component}
          owner: {input: owner}
          groupModes: {input: groupModes}
          attributeModes: {input: attributeModes}
    representations:
      xml:
        kind: element-sequence
        path:
          - f:Attribute
      yaml:
        kind: record-mapping
        key: name
  - format: nkdk-declarations/1
    kind: object
    id: metadata.public-form-column-requests
    inputs:
      component:
        type:
          kind: scalar
          scalar: text
      owner:
        type:
          kind: scalar
          scalar: text
      groupModes:
        index: metadata.form-additional-group-address-modes
      attributeModes:
        index: metadata.form-attribute-address-modes
    imports:
      rows: source.public-form-attribute-column-request-rows
    namespaces:
      f: http://v8.1c.ru/8.3/xcf/logform
    value:
      kind: record
      fields:
        - name: rows
          type: {use: rows, bind: {component: {input: component}, owner: {input: owner}, groupModes: {input: groupModes}, attributeModes: {input: attributeModes}}}
    representations:
      xml:
        kind: record
        fields:
          - {field: rows, path: [f:Form, f:Attributes]}
      yaml:
        kind: mapping
        fields:
          - {field: rows, key: Реквизиты}
    presence:
      - target:
          field: rows
        xml:
          missing: {denotes: {absent: true}}
        yaml:
          missing: {denotes: {absent: true}}
