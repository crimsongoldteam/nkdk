# Group-name multiplicity preparation; full conversion is separate.
format: nkdk-declarations/1
kind: catalog
declarations:
- kind: value
  id: source.form-additional-group-mode-row
  value:
    kind: record
    fields:
    - {name: table, type: {kind: scalar, scalar: text}}
  representations:
    xml:
      kind: record
      fields:
      - {field: table, path: [], attribute: table}
    yaml:
      kind: mapping
      fields:
      - {field: table, key: Таблица}
- kind: value
  id: source.form-additional-group-mode-rows
  namespaces: {f: 'http://v8.1c.ru/8.3/xcf/logform'}
  imports: {row: source.form-additional-group-mode-row}
  value:
    kind: sequence
    item: {use: row}
  representations:
    xml:
      kind: element-sequence
      path:
      - f:AdditionalColumns
      item: {kind: declared}
    yaml:
      kind: sequence
      item: {kind: declared}
- kind: fragment
  id: source.form-additional-group-modes-data
  imports: {groups: source.form-additional-group-mode-rows}
  inputs:
    component: {type: {kind: scalar, scalar: text}}
    owner: {type: {kind: scalar, scalar: text}}
    origin: {type: {kind: scalar, scalar: text}}
    parent: {type: {kind: scalar, scalar: text}}
  value:
    kind: record
    fields:
    - {name: groups, type: {use: groups}}
  representations:
    xml:
      kind: record
      fields:
      - {field: groups, path: ['f:Columns']}
    yaml:
      kind: mapping
      fields:
      - {field: groups, key: Дополнительные}
  presence:
  - target: {field: groups}
    xml:
      missing:
        denotes: {absent: true}
    yaml:
      missing:
        denotes: {absent: true}
  contributions:
  - index: metadata.form-additional-group-address-modes
    duplicates: coalesce-equal
    forEach: {in: {field: groups}, as: row}
    key:
      record:
        component: {input: component}
        owner: {input: owner}
        origin: {input: origin}
        parent: {input: parent}
        name:
          get:
            of: {var: row}
            field: table
    value:
      if:
        and:
        - not:
            eq:
            - get:
                of: {var: row}
                field: table
            - {literal: ''}
        - one:
            in: {field: groups}
            as: candidate
            where:
              eq:
              - get:
                  of: {var: candidate}
                  field: table
              - get:
                  of: {var: row}
                  field: table
      then: {literal: named}
      else: {literal: positional}
  namespaces: {f: 'http://v8.1c.ru/8.3/xcf/logform'}
- kind: value
  id: source.form-current-additional-group-mode-parent
  namespaces: {f: 'http://v8.1c.ru/8.3/xcf/logform'}
  imports: {groups: source.form-additional-group-modes-data}
  inputs:
    component: {type: {kind: scalar, scalar: text}}
    owner: {type: {kind: scalar, scalar: text}}
    origin: {type: {kind: scalar, scalar: text}}
    modes:
      type:
        kind: index
        key:
          kind: record
          fields:
          - {name: component, type: {kind: scalar, scalar: text}}
          - {name: name, type: {kind: scalar, scalar: text}}
          - {name: origin, type: {kind: scalar, scalar: text}}
          - {name: owner, type: {kind: scalar, scalar: text}}
        value: {kind: scalar, scalar: text}
  value:
    kind: record
    fields:
    - {name: name, type: {kind: scalar, scalar: text}}
  representations:
    xml:
      kind: record
      fields:
      - {field: name, path: [], attribute: name}
    yaml:
      kind: mapping
      fields:
      - {field: name, key: Имя}
  compose:
  - use: groups
    bind:
      component: {input: component}
      owner: {input: owner}
      parent:
        if:
          eq:
          - require:
              lookup:
                in: {input: modes}
                key:
                  record:
                    component: {input: component}
                    owner: {input: owner}
                    origin: {input: origin}
                    name: {field: name}
          - {literal: named}
        then:
          logicalAddress:
            parts:
            - {literal: Атрибут}
            - {field: name}
        else:
          logicalAddress:
            parts:
            - {literal: Атрибут}
            - {collectionPosition: true}
      origin: {input: origin}
- kind: value
  id: source.form-current-additional-group-mode-parents
  namespaces: {f: 'http://v8.1c.ru/8.3/xcf/logform'}
  imports: {row: source.form-current-additional-group-mode-parent}
  inputs:
    component: {type: {kind: scalar, scalar: text}}
