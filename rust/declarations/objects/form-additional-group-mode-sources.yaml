          - {name: origin, type: {kind: scalar, scalar: text}}
          - {name: owner, type: {kind: scalar, scalar: text}}
        value: {kind: scalar, scalar: text}
  value:
    kind: sequence
    item: {use: row, bind: {component: {input: component}, owner: {input: owner}, origin: {input: origin}, modes: {input: modes}}}
  representations:
    xml:
      kind: element-sequence
      path:
      - f:Attribute
      item: {kind: declared}
    yaml:
      kind: sequence
      item: {kind: declared}
- kind: object
  id: metadata.current-form-additional-group-mode-source
  namespaces: {f: 'http://v8.1c.ru/8.3/xcf/logform'}
  imports: {rows: source.form-current-additional-group-mode-parents}
  inputs:
    component: {type: {kind: scalar, scalar: text}}
    owner: {type: {kind: scalar, scalar: text}}
    modes: {index: metadata.form-attribute-address-modes}
  value:
    kind: record
    fields:
    - {name: rows, type: {use: rows, bind: {component: {input: component}, owner: {input: owner}, origin: {literal: current}, modes: {input: modes}}}}
  representations:
    xml:
      kind: record
      fields:
      - {field: rows, path: ['f:Form', 'f:Attributes']}
    yaml:
      kind: mapping
      fields:
      - {field: rows, key: Реквизиты}
  presence:
  - target: {field: rows}
    xml:
      missing:
        denotes: {absent: true}
    yaml:
      missing:
        denotes: {absent: true}
