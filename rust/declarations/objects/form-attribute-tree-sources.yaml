  value:
    kind: record
    fields: []
  representations:
    xml:
      kind: record
      fields: []
    yaml:
      kind: mapping
      fields: []
  compose:
  - {use: data}
  contributions:
  - index: metadata.form-attribute-identities
    forEach: {in: {field: rows}, as: row, index: position}
    key:
      record:
        component: {input: component}
        owner: {input: owner}
    reserve:
      get:
        of: {var: row}
        field: id
    when:
      present:
        get:
          of: {var: row}
          field: id
  - index: metadata.form-attribute-identities
    forEach: {in: {field: rows}, as: row, index: position}
    key:
      record:
        component: {input: component}
        owner: {input: owner}
        name:
          if:
            and:
            - not:
                eq:
                - get:
                    of: {var: row}
                    field: name
                - {literal: ''}
            - one:
                in: {field: rows}
                as: candidate
                where:
                  eq:
                  - get:
                      of: {var: candidate}
                      field: name
                  - get:
                      of: {var: row}
                      field: name
          then:
            logicalAddress:
              parent: {input: parent}
              parts:
              - {literal: Колонка}
              - get:
                  of: {var: row}
                  field: name
          else:
            logicalAddress:
              parent: {input: parent}
              parts:
              - {literal: Колонка}
              - {var: position}
    value:
      get:
        of: {var: row}
        field: id
    when:
      and:
      - present:
          get:
            of: {var: row}
            field: id
      - not:
          present:
            lookup:
              in: {input: current}
              key:
                record:
                  component: {input: component}
                  owner: {input: owner}
                  name:
                    if:
                      and:
                      - not:
                          eq:
                          - get:
                              of: {var: row}
                              field: name
                          - {literal: ''}
                      - one:
                          in: {field: rows}
                          as: candidate
                          where:
                            eq:
                            - get:
                                of: {var: candidate}
                                field: name
                            - get:
                                of: {var: row}
                                field: name
                    then:
                      logicalAddress:
                        parent: {input: parent}
                        parts:
                        - {literal: Колонка}
                        - get:
                            of: {var: row}
                            field: name
                    else:
                      logicalAddress:
                        parent: {input: parent}
                        parts:
                        - {literal: Колонка}
                        - {var: position}
  - index: metadata.form-attribute-identities
    forEach: {in: {field: rows}, as: row, index: position}
    key:
      record:
        component: {input: component}
        owner: {input: owner}
        name:
          if:
            and:
            - not:
                eq:
                - get:
                    of: {var: row}
                    field: name
                - {literal: ''}
            - one:
                in: {field: rows}
                as: candidate
                where:
                  eq:
                  - get:
                      of: {var: candidate}
                      field: name
                  - get:
                      of: {var: row}
                      field: name
          then:
            logicalAddress:
              parent: {input: parent}
              parts:
              - {literal: Колонка}
              - get:
                  of: {var: row}
                  field: name
          else:
            logicalAddress:
              parent: {input: parent}
              parts:
              - {literal: Колонка}
              - {var: position}
    when:
      not:
        present:
          lookup:
            in: {input: current}
            key:
              record:
                component: {input: component}
                owner: {input: owner}
                name:
                  if:
                    and:
                    - not:
                        eq:
                        - get:
                            of: {var: row}
                            field: name
                        - {literal: ''}
                    - one:
                        in: {field: rows}
                        as: candidate
                        where:
                          eq:
                          - get:
