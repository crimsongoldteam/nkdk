      kind: mapping
      fields:
      - {field: rows, key: Реквизиты}
  presence:
  - target: {field: rows}
    xml:
      missing:
        denotes: {absent: true}
    yaml:
      missing:
        denotes: {absent: true}
  contributions:
  - index: metadata.form-attribute-address-modes
    duplicates: coalesce-equal
    forEach: {in: {field: rows}, as: row}
    key:
      record:
        component: {input: component}
        owner: {input: owner}
        origin: {literal: current}
        name:
          get:
            of: {var: row}
            field: name
    value:
      if:
        and:
        - not:
            eq:
            - get:
                of: {var: row}
                field: name
            - {literal: ''}
        - one:
            in: {field: rows}
            as: candidate
            where:
              eq:
              - get:
                  of: {var: candidate}
                  field: name
              - get:
                  of: {var: row}
                  field: name
      then: {literal: named}
      else: {literal: positional}
