  representations:
    xml:
      kind: record
      fields:
      - {field: groups, path: []}
    yaml:
      kind: mapping
      fields:
      - {field: groups, key: Дополнительные}
  presence:
  - target: {field: groups}
    xml:
      missing:
        denotes: {absent: true}
    yaml:
      missing:
        denotes: {absent: true}
- kind: fragment
  id: source.form-tree-base-column-identities
  imports: {data: source.form-tree-column-row-data}
  inputs:
    component: {type: {kind: scalar, scalar: text}}
    owner: {type: {kind: scalar, scalar: text}}
