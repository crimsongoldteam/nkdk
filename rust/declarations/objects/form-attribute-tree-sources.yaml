- kind: object
  id: metadata.current-form-attribute-mode-source
  namespaces: {f: 'http://v8.1c.ru/8.3/xcf/logform'}
  imports: {rows: source.form-attribute-id-rows}
  inputs:
    component: {type: {kind: scalar, scalar: text}}
    owner: {type: {kind: scalar, scalar: text}}
  value:
    kind: record
    fields:
    - {name: rows, type: {use: rows}}
  representations:
    xml:
      kind: record
      fields:
      - {field: rows, path: ['f:Form', 'f:Attributes']}
