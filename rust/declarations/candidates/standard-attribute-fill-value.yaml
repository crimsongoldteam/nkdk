format: nkdk-declarations/1
kind: object
id: common.standard-attribute-fill-value
description: Значение заполнения стандартного реквизита; смысловые ограничения задаёт декларация владельца
namespaces:
  xr: http://v8.1c.ru/8.3/xcf/readable
imports: {choice: common.metadata-value}
inputs:
  defaultLanguage: {type: {kind: scalar, scalar: text}}
  registeredLanguages: {type: {kind: sequence, item: {kind: scalar, scalar: text}}}
  owners: {type: {kind: sequence, item: {kind: scalar, scalar: text}}}
  componentKind: {type: {kind: scalar, scalar: text}}
  policy: {type: {kind: scalar, scalar: text}}
value:
  kind: record
  fields:
  - name: value
    type:
      use: choice
      with: {exportNilValue: true}
      bind:
        defaultLanguage: {input: defaultLanguage}
        registeredLanguages: {input: registeredLanguages}
        onlyStringType: {literal: false}
representations:
  xml: {kind: record, fields: [{field: value, path: [Root, xr:FillValue]}]}
  yaml: {kind: mapping, fields: [{field: value, key: ЗначениеЗаполнения}]}
presence:
- target: {field: value}
  xml:
    missing: {denotes: {absent: true}}
    empty: [{form: nil, denotes: {absent: true}}]
    canonical: [{when: {not: {present: {field: value}}}, form: nil}]
  yaml:
    missing:
      denotes:
        if:
          and:
          - {eq: [{input: policy}, {literal: ownerReference}]}
          - {eq: [{input: componentKind}, {literal: configuration}]}
          - {one: {in: {input: owners}, as: owner, where: {literal: true}}}
        then:
          parseYaml:
            match:
              value: {find: {in: {input: owners}, as: owner, where: {literal: true}}}
              present:
                as: owner
                then: {concat: [{var: owner}, {literal: '.ПустаяСсылка'}]}
              absent: {literal: ''}
        else: {absent: true}
